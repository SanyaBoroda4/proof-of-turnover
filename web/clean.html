<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turno de limpieza</title>
<style>
  :root { --green: #1a7f37; --red: #b42318; --orange: #b54708; --grey: #57606a; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0;
         padding: 16px; max-width: 640px; margin-left: auto; margin-right: auto;
         background: #fff; color: #1f2328; font-size: 18px; }
  h1 { font-size: 24px; margin: 8px 0 16px; }
  h2.room { font-size: 20px; margin: 16px 0 4px; color: var(--grey); font-weight: 600; }
  .bar { height: 10px; background: #e5e5e5; border-radius: 5px; overflow: hidden; margin: 8px 0; }
  .bar > div { height: 100%; background: var(--green); }
  .progress { color: var(--grey); font-size: 15px; }
  .instruction { font-size: 26px; line-height: 1.35; margin: 4px 0 20px; font-weight: 600; }
  .btn { display: block; width: 100%; padding: 16px; margin: 10px 0; font-size: 20px;
         border: none; border-radius: 10px; background: var(--green); color: #fff;
         cursor: pointer; text-align: center; }
  .btn.secondary { background: #e5e5e5; color: #1f2328; }
  .btn.saved { outline: 3px solid #0969da; outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; }
  .camera { display: block; width: 100%; padding: 20px; margin: 10px 0; font-size: 22px;
         border: none; border-radius: 10px; background: #0969da; color: #fff;
         cursor: pointer; text-align: center; }
  .result { border-radius: 10px; padding: 14px 16px; margin: 12px 0; font-size: 19px; }
  .result.ok { background: #dafbe1; }
  .result.bad { background: #ffebe9; }
  .result.wait { background: #fff8c5; }
  .result button { font-size: 16px; padding: 8px 14px; margin-top: 6px; }
  .pending { border-top: 1px solid #ddd; margin-top: 24px; padding-top: 8px; }
  .pending li { margin: 12px 0; }
  .pending button, .open button { font-size: 16px; padding: 8px 14px; margin-left: 8px; }
  .open li { margin: 12px 0; }
  select, input[type=text] { font-size: 18px; padding: 10px; width: 100%; margin: 6px 0; }
  .error { background: #ffebe9; border-radius: 10px; padding: 14px; margin: 12px 0; }
  .small { font-size: 15px; color: var(--grey); }
</style>
</head>
<body>
<div id="app"><p>Cargando…</p></div>
<input type="file" id="snapFile" accept="image/*" capture="environment" hidden>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const CODE = params.get("code") || "";
const DEMO = params.get("demo") === "1";
let RUN = params.get("run") || "";
let LANG = "es", langPicked = false, LANGS = null, modePicked = "";
let tour = null, takenSet = new Set(), status = null, demoPhotos = null;
let overrideShot = null, selectedDemo = "", photoError = "", lastKey = null;
let pollTimer = null, pendingShot = null;
let prevShotId = null, seenReqIds = null;
let recorder = null, recStream = null, recChunks = [], recRoom = null;
let recStart = 0, recSeconds = 0, recTimer = null;
let transcribing = false, noteMsg = "", noteMsgTimer = null;

const I18N = {

    authError: "This link has no code. Ask for the full link.",

  },
  ru: {

    demoPhoto: "Демо-фото",
    starting: "Начинаем…",
    greeting: "Здравствуйте",
    hello: "Начинаем",
    progress: (room, rooms, taken, total) =>
      `Комната ${room} из ${rooms} · Фото ${taken} из ${total}`,
    checkingMove: "Проверяем фото… продолжайте.",
    checking: "Проверяем…",
    repeat: "Повторить",
    take: "Сфотографировать",
    retake: "Переснять фото",
    next: "Далее",
    ready: "✓ Готово",
    doneAll: "✓ Всё готово",
    finished: "Уборка завершена",
    open: n => {
      const form = new Intl.PluralRules("ru").select(n);
      if (form === "one") return `Осталась ${n} тема`;
      if (form === "few") return `Остались ${n} темы`;
      return `Осталось ${n} тем`;
    },
    oldPhoto: "Старое фото: оно сделано до начала. Сделайте новое.",
    authError: "В этой ссылке нет кода. Попросите полную ссылку.",
    noVoice: "На этом телефоне нет русского голоса; только текст.",
    setupHouse: "Настроить новый дом",
    startTurnover: "Начать уборку",
    back: "Назад",
    mic: "Записать заметку",
    stop: "Стоп",
    transcribing: "Распознаём…",
    noSpeech: "Речь не слышна.",
    insecure: "Для голосовых заметок нужна безопасная ссылка (https).",
    micDenied: "Нет доступа к микрофону.",
    note: "Заметка",
  },
};
function T() { return I18N[LANG] || I18N.en; }

function loadSavedLang() {
  return storeGet("pot-lang");
}
function saveLang(code) {
  storeSet("pot-lang", code);
}
function storeGet(key) {
  try { return localStorage.getItem(key) || ""; } catch (e) { return ""; }
}
function storeSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
}

async function api(path, opts) {
  const r = await fetch(path, opts || {});
  if (r.status === 401) throw new Error("auth");
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return r.json();
}

const VOICE_PREFS = {es: ["es-us", "es-mx"], en: ["en-us"], ru: ["ru-ru"]};
let voice = null;
function pickVoice() {
  voice = null;
  if (!("speechSynthesis" in window)) return;
  const all = speechSynthesis.getVoices() || [];
  const mine = all.filter(
    v => v.lang && v.lang.toLowerCase().startsWith(LANG));
  for (const pref of (VOICE_PREFS[LANG] || [])) {
    voice = mine.find(v => v.lang.toLowerCase() === pref) || null;
    if (voice) break;
  }
  voice = voice || mine[0] || null;
}
function voiceMissing() {
  if (!("speechSynthesis" in window)) return false;
  const all = speechSynthesis.getVoices() || [];
  if (!all.length) return false; // voices not loaded yet
  pickVoice();
  return !voice;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = () => { pickVoice(); renderMaybe(); };
}
const speechQueue = [];
let speaking = false;
let speechTimer = null;
function pumpSpeech() {
  if (speaking || !speechQueue.length || !("speechSynthesis" in window)) return;
  speaking = true;
  const u = new SpeechSynthesisUtterance(speechQueue.shift());
  if (voice) u.voice = voice;
  u.lang = (voice && voice.lang) || LANG;
  u.onend = u.onerror = () => {
    speaking = false;
    if (speechTimer) { clearTimeout(speechTimer); speechTimer = null; }
    pumpSpeech();
  };
  if (speechTimer) clearTimeout(speechTimer);
  speechTimer = setTimeout(() => {
    // Some Android Chrome versions never fire onend: force-advance.
    speechTimer = null;
    if (speaking) {
      speaking = false;
      try { speechSynthesis.cancel(); } catch (e) {}
      pumpSpeech();
    }
  }, 15000);
  speechSynthesis.speak(u);
}
function say(text) { speechQueue.push(text); pumpSpeech(); }
function repeatSay(text) {
  speechQueue.length = 0;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  speaking = false;
  say(text);
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function roomName(roomId) {
  for (const room of status.rooms) {
    if (room.id === roomId) return room.name;
  }
  return roomId;
}

function tourText(shot, base) {
  return shot[base + "_" + LANG] || shot[base + "_en"] || shot[base + "_es"] || "";
}

function roomHeading(shot) {
  return tourText(shot, "room_name") || roomName(shot.room_id);
}

function instruction(shot) {
  return tourText(shot, "instruction");
}

function shotOfItem(itemId) {
  for (const s of tour.shots) {
    if ((s.item_ids || []).indexOf(itemId) >= 0) return s;
  }
  return null;
}

function itemsById() {
  const map = {};
  for (const room of status.rooms) for (const item of room.items) map[item.id] = item;
  return map;
}

function currentShot() {
  if (overrideShot) {
    const s = tour.shots.find(x => x.shot_id === overrideShot);
    if (s) return s;
    overrideShot = null;
  }
  return status.current_shot;
}

function renderMaybe() {
  const key = JSON.stringify(
    [LANG, langPicked, modePicked, tour, status, overrideShot, selectedDemo,
     photoError, !!recorder, transcribing, noteMsg]);
  if (key === lastKey) return;
  lastKey = key;
  render();
}

function render() {
  document.documentElement.lang = LANG;
  document.title = T().title;
  const app = document.getElementById("app");
  if (!RUN) return renderStart(app);
  if (!tour || !status) { app.innerHTML = `<p>${esc(T().loading)}</p>`; return; }
  if (!status.current_shot && !status.checking.length && !overrideShot) {
    return renderDone(app);
  }
  return renderShot(app);
}

async function renderStart(app) {
  if (!langPicked) return renderLanguage(app);
  if (modePicked !== "turnover") return renderChoice(app);
  let props = [];
  try { props = (await api("/api/properties")).properties; } catch (e) { return fail(app, e); }
  const houses = props
    .filter(p => DEMO || p.id !== "demo-house")
    .sort((a, b) => (a.id === "demo-house") - (b.id === "demo-house"));
  const savedHouse = storeGet("pot-house");
  const options = houses.map(p =>
    `<option value="${esc(p.id)}"${p.id === savedHouse ? " selected" : ""}>${esc(p.name)}</option>`
  ).join("");
  app.innerHTML = `<h1>${esc(T().title)}</h1>
    <label class="small" for="prop">${esc(T().house)}</label>
    <select id="prop">${options}</select>
    <button class="btn" id="start">${esc(T().start)}</button>
    <p><a href="#" id="toChoice" class="small">‹ ${esc(T().back)}</a></p>
    ${DEMO ? `<p class="small">${esc(T().demoNote)}</p>` : ""}`;
  document.getElementById("start").onclick = startTour;
  document.getElementById("toChoice").onclick = ev => {
    ev.preventDefault();
    modePicked = "";
    lastKey = null;
    renderMaybe();
  };
}

function renderChoice(app) {
  app.innerHTML = `<h1>${esc(T().title)}</h1>
    <button class="btn" id="goSetup">${esc(T().setupHouse)}</button>
    <button class="btn secondary" id="goTurnover">${esc(T().startTurnover)}</button>
    <p><a href="#" id="changeLang" class="small">Idioma · Language · Язык</a></p>`;
  document.getElementById("goTurnover").onclick = () => {
    modePicked = "turnover";
    lastKey = null;
    renderMaybe();
  };
  document.getElementById("goSetup").onclick = () => {
    location.href = `/setup?code=${encodeURIComponent(CODE)}${DEMO ? "&demo=1" : ""}`;
  };
  document.getElementById("changeLang").onclick = ev => {
    ev.preventDefault();
    langPicked = false;
    lastKey = null;
    renderMaybe();
  };
}

async function renderLanguage(app) {
  if (LANGS === null) {
    try { LANGS = (await api("/api/languages")).languages; }
    catch (e) { return fail(app, e); }
  }
  const saved = loadSavedLang();
  const buttons = LANGS.map(l =>
    `<button class="btn${l.code === saved ? " saved" : ""}" data-lang="${esc(l.code)}">${esc(l.name)}</button>`
  ).join("");
  app.innerHTML = `<h1>Idioma · Language · Язык</h1>${buttons}`;
  app.querySelectorAll("[data-lang]").forEach(b => {
    b.onclick = () => {
      LANG = b.getAttribute("data-lang");
      saveLang(LANG);
      pickVoice();
      say(T().greeting);
      langPicked = true;
      lastKey = null;
      renderMaybe();
    };
  });
}

async function startTour() {
  say(T().hello);
  const app = document.getElementById("app");
  const property = document.getElementById("prop").value;
  storeSet("pot-house", property);
  app.innerHTML = `<p>${esc(T().starting)}</p>`;
  try {
    const created = await api("/api/runs", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({property: property, demo: DEMO, language: LANG}),
    });
    RUN = created.run_id;
    const url = new URL(location.href);
    url.searchParams.set("run", RUN);
    history.replaceState(null, "", url);
    await refresh();
    startPoll();
    const shot = currentShot();
    if (shot) {
      prevShotId = shot.shot_id;
      say(roomHeading(shot) + ". " + instruction(shot));
    }
    renderMaybe();
  } catch (e) { fail(app, e); }
}

function progressHtml() {
  const p = status.progress;
  const pct = p.shots_total ? Math.round(100 * p.shots_taken / p.shots_total) : 0;
  return `<div class="progress">${esc(T().progress(
    Math.min(p.rooms_done + 1, p.rooms_total), p.rooms_total,
    p.shots_taken, p.shots_total))}</div>
    <div class="bar"><div style="width:${pct}%"></div></div>`;
}

function shotState(shot) {
  const byId = itemsById();
  const items = (shot.item_ids || []).map(id => byId[id]).filter(Boolean);
  const critical = items.filter(i => i.critical);
  if (critical.length && critical.every(i => i.status === "proven")) return "done";
  if (critical.some(i => i.request)) return "failed";
  return "wait";
}

function shortName(shot) {
  const s = tourText(shot, "short") || roomHeading(shot);
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function micReady() {
  return !!window.isSecureContext && "MediaRecorder" in window &&
    !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

function fmtTime(seconds) {
  const m = Math.floor(seconds / 60), s = seconds % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function micHtml() {
  if (recorder) {
    return `<button class="btn secondary" id="micStop">${esc(T().stop)} (${esc(fmtTime(recSeconds))})</button>`;
  }
  if (transcribing) {
    return `<div class="result wait">${esc(T().transcribing)}</div>`;
  }
  if (micReady()) {
    return `<button class="btn secondary" id="micStart">${esc(T().mic)}</button>`;
  }
  return `<p class="small">${esc(T().insecure)}</p>`;
}

function noteRoomName(note) {
  for (const s of tour.shots) {
    if (s.room_id === note.room_id) {
      const name = tourText(s, "room_name");
      if (name) return name;
    }
  }
  return note.room_name;
}

function notesHtml() {
  const notes = (status.voice_notes || []).slice(0, 3);
  if (!notes.length) return "";
  return `<div>` + notes.map(n =>
    `<div class="result ok">${esc(T().note)} · ${esc(noteRoomName(n))}: ${esc(n.text)}</div>`
  ).join("") + `</div>`;
}

function cameraHtml(label) {
  if (DEMO) {
    const options = (demoPhotos || []).map(p => {
      const sel = p.url === selectedDemo ? " selected" : "";
      return `<option value="${esc(p.url)}"${sel}>${esc(p.name)}</option>`;
    }).join("");
    return `<label class="small" for="demoPick">${esc(T().demoPhoto)}</label>
      <select id="demoPick">${options}</select>
      <button class="btn" id="snapDemo">${esc(label)}</button>`;
  }
  return `<button class="camera" id="snapCam">${esc(label)}</button>`;
}

function recentHtml(current) {
  const ids = [];
  if (current && takenSet.has(current.shot_id)) ids.push(current.shot_id);
  for (const entry of (status.recent || [])) {
    if (ids.indexOf(entry.shot_id) < 0) ids.push(entry.shot_id);
  }
  const list = ids.slice(0, 5);
  if (!list.length) return "";
  const byId = itemsById();
  const shotById = {};
  tour.shots.forEach(s => { shotById[s.shot_id] = s; });
  const rows = list.map(shotId => {
    const shot = shotById[shotId];
    if (!shot) return "";
    const room = esc(roomHeading(shot));
    const short = esc(shortName(shot));
    const items = (shot.item_ids || []).map(id => byId[id]).filter(Boolean);
    const critical = items.filter(i => i.critical);
    if (critical.length && critical.every(i => i.status === "proven")) {
      return `<div class="result ok">✓ ${room}: ${short}</div>`;
    }
    const failed = critical.filter(i => i.request);
    if (failed.length) {
      return `<div class="result bad">${failed.map(i => `<p>${esc(i.request.cleaner)}</p>`).join("")}<button data-retake="${esc(shot.shot_id)}">${esc(T().retake)}</button></div>`;
    }
    return `<div class="result wait">${room}: ${esc(T().checking)}</div>`;
  }).join("");
  return rows ? `<div>${rows}</div>` : "";
}

function renderShot(app) {
  const shot = currentShot();
  let html = `<h1>${esc(T().title)}</h1>` + progressHtml();
  if (status.checking.length) html += `<div class="result wait">${esc(T().checkingMove)}</div>`;
  if (shot) {
    html += `<h2 class="room">${esc(roomHeading(shot))}</h2>
      <div class="instruction">${esc(instruction(shot))}</div>`;
    if (voiceMissing()) html += `<p class="small">${esc(T().noVoice)}</p>`;
    html += `<button class="btn secondary" id="repeat">${esc(T().repeat)}</button>`;
    if (!takenSet.has(shot.shot_id)) {
      html += cameraHtml(T().take);
    } else if (shotState(shot) === "done") {
      html += `<div class="result ok">${esc(T().ready)}</div>
        <button class="btn" id="next">${esc(T().next)}</button>`;
    } else if (status.checking.length) {
      html += `<div class="result wait">${esc(T().checking)}</div>`;
    }
    html += micHtml();
    if (noteMsg) html += `<div class="result wait">${esc(noteMsg)}</div>`;
    html += recentHtml(shot);
    html += notesHtml();
  }
  if (photoError) html += `<div class="error">${esc(photoError)}</div>`;
  app.innerHTML = html;
  if (shot) {
    document.getElementById("repeat").onclick = () =>
      repeatSay(roomHeading(shot) + ". " + instruction(shot));
    const next = document.getElementById("next");
    if (next) next.onclick = () => { overrideShot = null; renderMaybe(); };
    wireCamera(shot);
    const micStart = document.getElementById("micStart");
    if (micStart) micStart.onclick = () => startRec(shot);
    const micStop = document.getElementById("micStop");
    if (micStop) micStop.onclick = stopRec;
  }
  app.querySelectorAll("[data-retake]").forEach(b => {
    b.onclick = () => {
      overrideShot = b.getAttribute("data-retake");
      renderMaybe();
    };
  });
}

function wireCamera(shot) {
  const pick = document.getElementById("demoPick");
  if (pick) {
    if (!selectedDemo && demoPhotos && demoPhotos.length) selectedDemo = demoPhotos[0].url;
    pick.value = selectedDemo;
    pick.onchange = () => { selectedDemo = pick.value; };
    const snap = document.getElementById("snapDemo");
    if (snap) snap.onclick = async () => {
      const blob = await (await fetch(selectedDemo)).blob();
      upload(shot, new File([blob], "demo.jpg", {type: "image/jpeg"}));
    };
    return;
  }
  const cam = document.getElementById("snapCam");
  if (cam) cam.onclick = () => openCamera(shot.shot_id);
}

function openCamera(shotId) {
  pendingShot = shotId;
  document.getElementById("snapFile").click();
}

function pickMime() {
  const cands = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
  if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
    for (const c of cands) {
      try {
        if (MediaRecorder.isTypeSupported(c)) return c;
      } catch (e) {}
    }
  }
  return "";
}

function tickRec() {
  recSeconds = Math.floor((Date.now() - recStart) / 1000);
  const b = document.getElementById("micStop");
  if (b) b.textContent = `${T().stop} (${fmtTime(recSeconds)})`;
  if (recSeconds >= 60) stopRec();
}

async function startRec(shot) {
  noteMsg = "";
  recRoom = shot.room_id;
  try {
    recStream = await navigator.mediaDevices.getUserMedia({audio: true});
  } catch (e) {
    noteMsg = T().micDenied;
    scheduleNoteClear();
    renderMaybe();
    return;
  }
  const mime = pickMime();
  try {
    recorder = mime ? new MediaRecorder(recStream, {mimeType: mime})
      : new MediaRecorder(recStream);
  } catch (e) {
    recStream.getTracks().forEach(t => t.stop());
    recStream = null;
    noteMsg = T().micDenied;
    scheduleNoteClear();
    renderMaybe();
    return;
  }
  recChunks = [];
  recorder.ondataavailable = ev => { if (ev.data && ev.data.size) recChunks.push(ev.data); };
  recorder.onstop = sendRec;
  recStart = Date.now();
  recSeconds = 0;
  recorder.start();
  if (recTimer) clearInterval(recTimer);
  recTimer = setInterval(tickRec, 250);
  lastKey = null;
  renderMaybe();
}

function stopRec() {
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  if (recorder && recorder.state !== "inactive") recorder.stop();
}

function scheduleNoteClear() {
  if (noteMsgTimer) clearTimeout(noteMsgTimer);
  noteMsgTimer = setTimeout(() => {
    noteMsgTimer = null;
    noteMsg = "";
    renderMaybe();
  }, 8000);
}

async function sendRec() {
  const chunks = recChunks;
  const mime = (recorder && recorder.mimeType) || "";
  if (recStream) {
    recStream.getTracks().forEach(t => t.stop());
    recStream = null;
  }
  recorder = null;
  recChunks = [];
  transcribing = true;
  lastKey = null;
  renderMaybe();
  const ext = mime.indexOf("mp4") >= 0 ? "mp4" : "webm";
  const form = new FormData();
  form.append("room_id", recRoom);
  form.append("audio", new Blob(chunks, {type: mime || "audio/webm"}), `note.${ext}`);
  try {
    const res = await api(`/api/runs/${encodeURIComponent(RUN)}/notes`,
      {method: "POST", body: form});
    transcribing = false;
    if (res.status === "no_speech") {
      noteMsg = T().noSpeech;
      scheduleNoteClear();
    } else {
      noteMsg = "";
      await refresh();
    }
    renderMaybe();
  } catch (e) {
    transcribing = false;
    noteMsg = e.message;
    scheduleNoteClear();
    renderMaybe();
  }
}

async function upload(shot, file) {
  const form = new FormData();
  form.append("shot_id", shot.shot_id);
  form.append("image", file);
  try {
    await api(`/api/runs/${encodeURIComponent(RUN)}/photos`, {method: "POST", body: form});
    photoError = "";
    overrideShot = null;
    await refresh();
    renderMaybe();
  } catch (e) {
    photoError = e.message.indexOf("foto antigua") >= 0 ? T().oldPhoto : e.message;
    renderMaybe();
  }
}

function renderDone(app) {
  const byId = itemsById();
  let html = `<h1>${esc(T().finished)}</h1>` + progressHtml();
  if (!status.open.length) {
    html += `<div class="result ok">${esc(T().doneAll)}</div>`;
  } else {
    const head = T().open(status.open.length);
    html += `<p>${esc(head)}:</p><ul class="open">` + status.open.map(id => {
      const item = byId[id];
      const text = item.request ? item.request.cleaner : item.label;
      const s = shotOfItem(id);
      const btn = s ? ` <button data-shot="${esc(s.shot_id)}">${esc(T().take)}</button>` : "";
      return `<li>${esc(text)}${btn}</li>`;
    }).join("") + `</ul>`;
  }
  app.innerHTML = html;
  app.querySelectorAll("[data-shot]").forEach(b => {
    b.onclick = () => { overrideShot = b.getAttribute("data-shot"); renderMaybe(); };
  });
}

function fail(app, e) {
  if (e.message === "auth") {
    app.innerHTML = `<div class="error">${esc(T().authError)}</div>`;
  } else {
    app.innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}

function announce() {
  const cur = currentShot();
  const curId = cur ? cur.shot_id : null;
  if (prevShotId !== null && curId && curId !== prevShotId) {
    say(roomHeading(cur) + ". " + instruction(cur));
  }
  if (curId) prevShotId = curId;
  const byId = itemsById();
  const current = new Set();
  for (const id of status.open) {
    const item = byId[id];
    if (item && item.request) {
      current.add(id);
      if (seenReqIds && !seenReqIds.has(id)) say(item.request.cleaner);
    }
  }
  seenReqIds = current;
}

async function refresh() {
  const [t, s] = await Promise.all([
    api(`/api/runs/${encodeURIComponent(RUN)}/tour`),
    api(`/api/runs/${encodeURIComponent(RUN)}/status`),
  ]);
  tour = {shots: t.shots};
  takenSet = new Set(t.taken);
  status = s;
  if (s.language && I18N[s.language]) {
    if (LANG !== s.language) { LANG = s.language; pickVoice(); }
    langPicked = true;
  }
  if (DEMO && demoPhotos === null) {
    try { demoPhotos = (await api("/api/demo-photos")).photos; }
    catch (e) { demoPhotos = []; }
  }
  announce();
}

function startPoll() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    try { await refresh(); renderMaybe(); } catch (e) {}
  }, 2000);
}

async function boot() {
  document.getElementById("snapFile").onchange = ev => {
    const input = ev.target;
    if (input.files.length && pendingShot) {
      const shot = tour.shots.find(x => x.shot_id === pendingShot);
      const file = input.files[0];
      input.value = "";
      if (shot) upload(shot, file);
    } else {
      input.value = "";
    }
  };
  document.addEventListener("visibilitychange", async () => {
    if (!document.hidden && RUN) {
      try { await refresh(); renderMaybe(); } catch (e) {}
    }
  });
  const app = document.getElementById("app");
  try {
    if (RUN) {
      await refresh();
      startPoll();
    }
    renderMaybe();
  } catch (e) { fail(app, e); }
}
boot();
</script>
