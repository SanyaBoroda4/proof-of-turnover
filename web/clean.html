<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F5">
<title>Turno de limpieza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --linen: #F2F3F5; --ink: #1F2328; --haint: #D6DCE4; --marsh: #3D4756;
    --marsh-dark: #2C3440; --brick: #A8554C; --dune: #9A7F4E; --dune-bg: #F1ECE2;
    --white: #FFFFFF; --muted: #6A707A; --line: #E1E4E8;
    --float-shadow: 0 8px 28px rgba(31, 35, 40, 0.16);
  }
  * { box-sizing: border-box; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent; }
  body { font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
         margin: 0; background: var(--linen); color: var(--ink);
         font-size: 17px; line-height: 24px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 32px; }
  h1 { font-size: 22px; line-height: 28px; margin: 8px 0 16px; text-align: center; }
  :focus-visible { outline: 3px solid var(--marsh); outline-offset: 2px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px;
         overflow: hidden; margin: 8px 0 0; }
  .bar > div { height: 100%; background: var(--haint); border-radius: 3px; }
  .instruction { font-size: 26px; line-height: 31px; margin: 4px 0 12px; font-weight: 700; }
  .btn { white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 10px;
         width: 100%; padding: 16px 12px; margin: 10px 0; font-size: 17px; font-weight: 700;
         font-family: inherit; min-height: 56px; border: none; border-radius: 20px;
         background: var(--marsh); color: var(--white); cursor: pointer; text-align: center; }
  .btn.secondary { background: var(--white); color: var(--ink);
                   border: 2px solid var(--line); }
  .btn.saved { outline: 3px solid var(--marsh); outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; }
  .btn svg, .iconbtn svg, .link svg { flex: none; }
  .result { border-radius: 20px; padding: 14px 16px; margin: 12px 0; font-size: 17px; }
  .result.ok { background: var(--haint); color: var(--ink); }
  .result.bad { background: #F3E1DD; }
  .result.wait { background: var(--dune-bg); }
  select, input[type=text] { font-size: 17px; padding: 12px; width: 100%; margin: 6px 0;
         border-radius: 20px; border: 2px solid var(--line); background: var(--white);
         color: var(--ink); font-family: inherit; min-height: 56px; }
  .error { background: #F3E1DD; border-radius: 20px; padding: 14px 16px; margin: 12px 0; }
  .small { font-size: 14px; line-height: 19px; color: var(--muted); }
  .link { display: inline-flex; align-items: center; gap: 6px; background: none;
          border: none; color: var(--marsh); font-size: 16px; font-weight: 700;
          font-family: inherit; cursor: pointer; padding: 12px 4px; min-height: 48px; }
  .brand { text-align: center; margin: 32px 0 24px; }
  .brand svg { color: var(--marsh); }
  .brand .wordmark { font-size: 22px; line-height: 28px; font-weight: 700; margin-top: 8px; }
  .tile { min-height: 88px; font-size: 20px; }
  .langline { text-align: center; margin-top: 24px; }
  /* Round: full-bleed camera */
  #camLayer[hidden] { display: none; }
  #camLayer { position: fixed; inset: 0; background: #121417; }
  #camLayer video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .round { position: fixed; inset: 0; background: transparent; overflow: hidden; }
  .round.nocam { background: #121417; }
  .round .novid, #sheet .novid { position: absolute; inset: 0; display: flex; align-items: center;
                  justify-content: center; color: var(--white); font-size: 17px;
                  padding: 24px; text-align: center; }
  .topcard { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px;
             background: rgba(255, 255, 255, 0.78);
             -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
             border-radius: 20px; box-shadow: var(--float-shadow); padding: 12px 16px; }
  .topcard .row1 { display: flex; align-items: center; gap: 12px; }
  .topcard .room { font-size: 17px; font-weight: 700; flex: 1; }
  .topcard .count { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .topcard .instruction { font-size: 26px; line-height: 31px; margin: 6px 0 2px; }
  .topcard .instruction.long { font-size: 22px; line-height: 27px; }
  .iconbtn { display: inline-flex; align-items: center; justify-content: center;
             width: 52px; height: 52px; border-radius: 50%; border: none;
             background: var(--white); color: var(--ink); cursor: pointer;
             box-shadow: var(--float-shadow); font-family: inherit; }
  .iconbtn.small { width: 44px; height: 44px; box-shadow: none;
                   border: 2px solid var(--line); }
  .iconbtn.rec { background: var(--brick); color: var(--white); }
  .iconbtn .t { font-size: 12px; font-weight: 700; margin-left: 2px; }
  .bottombar { position: absolute; left: 0; right: 0;
               bottom: max(12px, env(safe-area-inset-bottom));
               display: flex; align-items: flex-end; justify-content: space-around;
               padding: 0 16px; }
  .shutter { width: 78px; height: 78px; border-radius: 50%; cursor: pointer;
             background: var(--white); border: none; padding: 7px;
             box-shadow: var(--float-shadow); }
  .shutter span { display: block; width: 100%; height: 100%; border-radius: 50%;
                  background: var(--marsh); }
  .shutter:active span { background: var(--marsh-dark); }
  .exthumb, .lastshot { position: relative; width: 72px; height: 72px; border-radius: 18px;
             overflow: hidden; border: 3px solid var(--white); padding: 0; cursor: pointer;
             background: var(--muted); box-shadow: var(--float-shadow); }
  .exthumb img, .lastshot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .excol { display: flex; flex-direction: column; align-items: center; }
  .excap { font-size: 11px; line-height: 14px; color: var(--white); margin-top: 2px;
           text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6); }
  /* Round card view (opaque, above the playing camera) */
  .rcard { position: fixed; inset: 0; z-index: 1; overflow-y: auto;
           background: var(--linen); }
  .rcard .inner { max-width: 640px; margin: 0 auto;
           padding: max(12px, env(safe-area-inset-top)) 16px
                    calc(120px + env(safe-area-inset-bottom)); }
  .rhead { display: flex; align-items: center; gap: 12px; }
  .rhead .room { font-size: 17px; font-weight: 700; flex: 1; text-align: center; }
  .rhead .count { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .shotcard { position: relative; background: var(--white); border-radius: 24px;
              padding: 20px 18px; margin: 12px 0; box-shadow: var(--float-shadow); }
  .shotcard .instruction { font-size: 26px; line-height: 32px; margin: 0; font-weight: 700; }
  .shotcard .instruction.long { font-size: 22px; line-height: 28px; }
  .shotcard.tucked .instruction { padding-right: 72px; }
  .expop { display: block; border: none; padding: 0; cursor: pointer;
           position: relative; background: var(--muted); }
  .expop.big { width: 100%; height: 36vh; height: 36svh; margin-top: 16px;
               border-radius: 18px; overflow: hidden; }
  .expop.big.pop { animation: expop 340ms cubic-bezier(.2, 1.3, .4, 1); }
  .expop.big.leave { animation: extuck 280ms ease-in forwards;
                     transform-origin: top right; }
  @keyframes expop { from { transform: scale(.85); opacity: 0; }
                     to { transform: none; opacity: 1; } }
  @keyframes extuck { to { transform: scale(.15); opacity: 0; } }
  .expop img { width: 100%; height: 100%; object-fit: contain; background: var(--linen); display: block; }
  .expop .chip2 { position: absolute; left: 10px; bottom: 10px; background: var(--white);
                  border-radius: 999px; padding: 4px 12px; font-size: 13px;
                  font-weight: 700; }
  .expop.small { position: absolute; top: 14px; right: 14px; width: 60px; height: 60px;
                 border-radius: 14px; overflow: hidden;
                 box-shadow: var(--float-shadow); }
  .pillrow { display: flex; gap: 10px; margin: 12px 0; }
  .pillbtn { flex: 1; display: inline-flex; align-items: center; justify-content: center;
             gap: 8px; background: var(--white); border: 2px solid var(--line);
             border-radius: 999px; min-height: 48px; padding: 10px 12px;
             font-size: 16px; font-weight: 700; font-family: inherit;
             color: var(--ink); cursor: pointer; }
  .pillbtn.rec { color: var(--brick); border-color: var(--brick); }
  .pillbtn .t { font-size: 14px; }
  .takebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
             padding: 20px 16px calc(14px + env(safe-area-inset-bottom));
             background: linear-gradient(to top, var(--linen) 75%,
                                         rgba(242, 243, 245, 0)); }
  .takerow { display: flex; gap: 12px; align-items: center; max-width: 640px;
             margin: 0 auto; }
  #takePhoto { flex: 1; min-height: 64px; font-size: 19px; margin: 0; }
  .takerow .demobox { flex: 1; }
  .lastshot { width: 56px; height: 56px; flex: none; }
  /* Round camera view */
  .camtop { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px;
            background: rgba(255, 255, 255, 0.78);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            border-radius: 20px; box-shadow: var(--float-shadow); padding: 12px 16px;
            display: flex; gap: 12px; align-items: center; }
  .camtop .instruction { font-size: 20px; line-height: 25px; margin: 0; flex: 1;
                         font-weight: 700; }
  .camtop .exthumb { flex: none; }
  .cambar { position: absolute; left: 0; right: 0;
            bottom: max(24px, env(safe-area-inset-bottom));
            display: flex; justify-content: center; }
  .lastshot .check { position: absolute; right: 2px; bottom: 2px; background: var(--marsh);
             color: var(--white); border-radius: 50%; width: 26px; height: 26px;
             font-size: 16px; line-height: 26px; text-align: center; }
  .sidecol { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .roundmsg { position: absolute; left: 12px; right: 12px; bottom: 116px; display: flex;
              flex-direction: column; gap: 8px; align-items: center;
              pointer-events: none; }
  .roundmsg > * { pointer-events: auto; }
  .pill { background: rgba(255, 255, 255, 0.92); border-radius: 20px;
          padding: 10px 16px; font-size: 14px; max-width: 100%; }
  .pill.warn { background: var(--dune-bg); }
  .pill button { font: inherit; color: inherit; background: none; border: none;
                 padding: 0; cursor: pointer; text-align: left; }
  .testrow { display: flex; justify-content: space-between; align-items: baseline;
               margin-top: 6px; }
  .testrow .link, .testrow a { font-size: 14px; color: var(--marsh); }
  .skiprow { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
  .skiprow .skipmeta { flex: 1; display: flex; flex-direction: column; }
  .skiprow .btn { width: auto; flex: none; margin: 0; padding: 12px 16px; }
  .centerline { text-align: center; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0;
           pointer-events: none; z-index: 40; }
  #flash.on { opacity: 1; transition: none; }
  #flash.off { opacity: 0; transition: opacity 180ms ease-out; }
  /* Cards */
  .cardshead { margin: 8px 0 4px; text-align: center; }
  .cardshead h1 { margin: 0; }
  .cardshead .left { font-size: 17px; color: var(--muted); margin: 2px 0 12px; }
  .stack { position: relative; margin: 0 0 32px; }
  .peek { position: absolute; left: 0; right: 0; bottom: -12px; height: 60px;
          background: var(--white); border-radius: 20px; }
  .peek.p1 { transform: scale(0.96); bottom: -12px; opacity: 0.8; }
  .peek.p2 { transform: scale(0.92); bottom: -22px; opacity: 0.5; }
  .card { position: relative; background: var(--white); border-radius: 20px;
          padding: 16px; }
  .card.slide { animation: slidein 250ms ease-out; }
  .card.out { animation: flyout 220ms ease-in forwards; }
  @keyframes slidein {
    from { transform: translateX(60px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  @keyframes flyout {
    to { transform: translateX(-60px) scale(0.94); opacity: 0; }
  }
  .spinner { width: 36px; height: 36px; border-radius: 50%;
             border: 4px solid var(--line); border-top-color: var(--marsh);
             animation: spin 0.9s linear infinite; margin: 12px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .checkingcard img.photo { width: 100%; border-radius: 20px; display: block;
             max-height: 300px; object-fit: contain; background: var(--linen); }
  @media (prefers-reduced-motion: reduce) {
    .card.slide, .card.out { animation: none; }
    .spinner { animation: none; }
    #flash.on, #flash.off { transition: none; }
    .stamp { animation: none; }
    .psheet.anim, .pbackdrop.anim { animation: none; }
    .expop.big.pop, .expop.big.leave { animation: none; }
  }
  .tagrow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .tag { display: inline-block; border-radius: 999px; padding: 6px 14px;
         font-size: 14px; font-weight: 700; }
  .tag.fix { background: var(--brick); color: var(--white); }
  .tag.missing { background: var(--dune-bg); color: var(--ink);
                 border: 2px solid var(--dune); }
  .tagrow .of { margin-left: auto; font-size: 14px; color: var(--muted); }
  .photowrap { position: relative; margin: 0 0 12px; }
  .photowrap img.photo { width: 100%; border-radius: 20px; cursor: zoom-in; display: block;
    max-height: max(200px, calc(100vh - 506px));
    max-height: max(200px, calc(100svh - 506px));
    object-fit: contain; background: var(--linen); }
  .exrow { display: flex; align-items: center; gap: 10px; width: 100%;
           margin: 0 0 12px; padding: 0; border: none; background: none;
           cursor: zoom-in; text-align: left; font-family: inherit; }
  .exrow img { width: 64px; height: 64px; border-radius: 14px; object-fit: cover;
               display: block; flex: none; }
  .exrow span { font-size: 14px; font-weight: 700; color: var(--muted); }
  .widepill { position: absolute; left: 50%; bottom: 122px; z-index: 3;
              transform: translateX(-50%); background: rgba(255, 255, 255, 0.88);
              color: var(--ink); border-radius: 999px; padding: 5px 12px;
              font-size: 14px; font-weight: 700; }
  #sheet .widepill { position: static; transform: none; }
  .card .instruction { font-size: 22px; line-height: 28px; }
  .shotcard .instruction, .card .instruction, .topcard .instruction { text-align: center; }
  .psheethead h2 { flex: 1; text-align: center; }
  .cardactions { position: sticky; bottom: 0; z-index: 2; background: var(--white);
                 margin: 0 -16px; padding: 2px 16px calc(6px + env(safe-area-inset-bottom));
                 border-radius: 0 0 20px 20px;
                 box-shadow: 0 -12px 16px -14px rgba(31, 35, 40, 0.28); }
  .btnrow { display: flex; gap: 10px; }
  .btnrow .btn { margin: 10px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip { border: 2px solid var(--line); border-radius: 999px; background: var(--white);
          color: var(--ink); font-size: 16px; font-family: inherit;
          padding: 10px 16px; min-height: 48px; cursor: pointer; }
  .toast { position: fixed; left: 12px; right: 12px; transform: none;
           top: max(12px, env(safe-area-inset-top));
           background: var(--marsh); color: var(--white); font-size: 17px; font-weight: 700;
           border-radius: 16px; padding: 16px 20px; text-align: center; z-index: 50;
           box-shadow: var(--float-shadow); white-space: normal; pointer-events: none; }
  .pbackdrop { position: fixed; inset: 0; z-index: 20; background: rgba(18, 20, 23, 0.38); }
  .psheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 640px; margin: 0 auto;
            background: var(--white); border-radius: 24px 24px 0 0; box-shadow: var(--float-shadow);
            padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
            max-height: 85vh; max-height: 85svh; overflow-y: auto; }
  .psheethead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .psheethead h2 { margin: 0; font-size: 22px; line-height: 28px; }
  .psheet.anim { animation: sheetup 220ms ease-out; }
  .pbackdrop.anim { animation: fadein 160ms ease-out; }
  @keyframes sheetup { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(18, 20, 23, 0.9);
             cursor: zoom-out; z-index: 60; text-align: center; padding: 48px 24px 24px; }
  #overlay img { max-width: 95%; max-height: 85%; border-radius: 20px; }
  #bigcap { color: var(--white); font-size: 17px; margin-top: 12px; }
  /* Retake sheet */
  #sheet[hidden] { display: none; }
  #sheet { position: fixed; inset: 0; z-index: 30; background: transparent;
           pointer-events: none; }
  #sheet.nocam { background: #121417; }
  #sheet .sheettop, #sheet .sheetbar { pointer-events: auto; }
  body.sheet-open #app { visibility: hidden; }
  #sheet .sheettop { position: absolute; top: max(12px, env(safe-area-inset-top));
             left: 12px; right: 12px; background: rgba(255, 255, 255, 0.78);
             -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
             border-radius: 20px; box-shadow: var(--float-shadow); padding: 12px 16px; }
  #sheet .sheetrow { display: flex; gap: 12px; align-items: center; }
  #sheet .instruction { font-size: 22px; line-height: 28px; margin: 8px 0 0; flex: 1; }
  #sheet .exthumb { flex: none; }
  #sheet .sheetbar { position: absolute; left: 0; right: 0;
             bottom: max(24px, env(safe-area-inset-bottom));
             display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 10px; }
  /* Final */
  .stampwrap { text-align: center; margin: 40px 0 24px; }
  .stamp { display: inline-flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 4px; width: 208px; height: 208px;
           border-radius: 50%; background: var(--white);
           border: 10px solid var(--haint); color: var(--marsh);
           font-size: 20px; font-weight: 700; line-height: 24px;
           animation: stampin 300ms ease-out; }
  @keyframes stampin {
    from { transform: scale(1.15); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .stats { list-style: none; margin: 0 0 16px; padding: 0; }
  .stats li { background: var(--white); border-radius: 20px; padding: 14px 16px;
              margin: 8px 0; font-size: 17px; }
</style>
</head>
<body>
<div id="camLayer" hidden><video id="camView" playsinline muted autoplay></video></div>
<div id="app"><p>Cargando…</p></div>
<div id="sheet" hidden></div>
<div id="flash"></div>
<audio id="voiceAudio" playsinline></audio>
<div id="overlay"><img id="big" alt=""><div id="bigcap"></div></div>
<input type="file" id="snapFile" accept="image/*" capture="environment" hidden>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const CODE = params.get("code") || "";
const DEMO = params.get("demo") === "1";
const TEST = params.get("test") === "1";
const WIDE = params.get("wide") !== "0";
let RUN = params.get("run") || "";
let LANG = "es", langPicked = false, LANGS = null, modePicked = "";
let tour = null, tourRun = "", takenSet = new Set(), status = null, demoPhotos = null;
let overrideShot = null, selectedDemo = "", photoError = "", lastKey = null;
let pollTimer = null, pendingShot = null, pendingCard = null;
let prevShotId = null;
let recorder = null, recStream = null, recChunks = [], recRoom = null, recItem = null;
let recOnDone = null, recStart = 0, recSeconds = 0, recTimer = null;
let transcribing = false, noteMsg = "", noteMsgTimer = null;
let optimistic = new Map();
let cardOrder = [], retakePhotos = {}, spokenCard = null, lastShownCard = null;
let role = null;
let skipReminderKey = "", skipReminderSpokenKey = "";
let cardsTotal = 0;
let photosDoneSaid = false, saidFinal = false;
let cardPanel = null, cardNoteId = null, cardNoteText = "";
let panelFresh = false;
let toast = null, toastTimer = null;
let retrying = false, navDepth = 0;
let camStream = null, camStarting = false, camMode = "live", camSheet = null;
let camWaiting = false;
let camWide = false, camWideBusy = false, camDeviceId = null, camNormalId = null;
let camWideShot = null, camWideImpossible = false;
let roundView = "card";
let exState = {shot: null, big: false, popAt: null, leaveAt: null, timer: null};
let prevScreen = "";

const REASONS = ["broken", "before", "supplies", "wont_clean", "other"];

const I18N = {
  es: {
    title: "Turno de limpieza",
    loading: "Cargando…",
    start: "Empezar",
    house: "Casa",
    demoNote: "Modo demo: las fotos salen de una carpeta.",
    demoPhoto: "Foto demo",
    starting: "Empezando…",
    greeting: "Hola",
    hello: "Empezamos",
    ofTotal: (done, total) => `${done} de ${total}`,
    toFix: n => `${n} por arreglar`,
    fixTag: "Arregla esto",
    missingTag: "Falta foto",
    shouldLook: "Así debe verse",
    howShould: "Así debe verse",
    exampleCap: "Ejemplo",
    camHint: "Permite el acceso a la cámara para hacer fotos aquí",
    camStarting: "Iniciando cámara…",
    close: "Cerrar",
    checking: "Revisando…",
    checkingPhotos: (done, total) => `Revisando tus fotos: ${done} de ${total}`, checkingRetake: "Revisando tu foto nueva… normalmente menos de un minuto",
    photosDone: "Fotos listas ✓",
    repeat: "Repetir",
    take: "Fotografiar",
    retakeLast: "Repetir la última foto",
    notSent: "Foto no enviada – toca para enviarla de nuevo",
    doneAll: "✓ Todo listo",
    readyStamp: "Listo para huéspedes",
    sentStamp: "Enviado al anfitrión",
    proven: n => `Verificados: ${n}`,
    fixedByYou: n => `Arreglados por ti: ${n}`,
    cantFixCount: n => `No se pudo: ${n}`,
    markedFineCount: n => `Marcados como bien: ${n}`,

const GET_TIMEOUT_MS = 12000;
async function api(path, opts) {
  opts = opts || {};
  let signal = opts.signal;
  let timer = null;
  if (!signal && (!opts.method || opts.method === "GET")) {
    const ctrl = new AbortController();
    signal = ctrl.signal;
    timer = setTimeout(() => ctrl.abort(), GET_TIMEOUT_MS);
  }
  try {
    const r = await fetch(path, {...opts, signal: signal});
    if (r.status === 401) throw new Error("auth");
    if (!r.ok) {
      let detail = r.statusText;
      try { detail = (await r.json()).detail || detail; } catch (e) {}
      throw new Error(detail);
    }
    return r.json();
  } finally {
    if (timer) clearTimeout(timer);
  }
}

const UPLOAD_TIMEOUT_MS = 30000;
async function apiUpload(path, opts) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), UPLOAD_TIMEOUT_MS);
  try {
    return await api(path, {...(opts || {}), signal: ctrl.signal});
  } finally {
    clearTimeout(timer);
  }
}

async function uploadWithRetry(path, form) {
  const delays = [0, 2000, 5000];
  let lastError = null;
  for (const delay of delays) {
    if (delay) await new Promise(r => setTimeout(r, delay));
    try {
      return await apiUpload(path, {method: "POST", body: form});
    } catch (e) {
      lastError = e;
      if (e.message && e.message.indexOf("foto antigua") >= 0) throw e;
    }
  }
  throw lastError;
}

const VOICE_PREFS = {es: ["es-us", "es-mx"], en: ["en-us"], ru: ["ru-ru"]};
let voice = null;
function pickVoice() {
  voice = null;
  if (!("speechSynthesis" in window)) return;
  const all = speechSynthesis.getVoices() || [];
  const langOf = v => (v.lang || "").toLowerCase().replace("_", "-");
  if (LANG === "en") {
    const british = all.filter(v => langOf(v).startsWith("en-gb"));
    for (const name of ["kate", "serena", "martha", "stephanie"]) {
      voice = british.find(v => (v.name || "").toLowerCase().includes(name)) || null;
      if (voice) break;
    }
    voice = voice || british[0]
      || all.find(v => langOf(v).startsWith("en-us"))
      || all.find(v => langOf(v).startsWith("en")) || null;
    return;
  }
  const mine = all.filter(v => langOf(v).startsWith(LANG));
  for (const pref of (VOICE_PREFS[LANG] || [])) {
    voice = mine.find(v => langOf(v) === pref) || null;
    if (voice) break;
  }
  voice = voice || mine[0] || null;
}
function voiceMissing() {
  if (!("speechSynthesis" in window)) return false;
  const all = speechSynthesis.getVoices() || [];
  if (!all.length) return false; // voices not loaded yet
  pickVoice();
  return !voice;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = () => { pickVoice(); renderMaybe(); };
}
const speechQueue = [];
let speaking = false;
let speechTimer = null;
const voiceCache = new Map();
let voiceOk = null, voiceUnlocked = false;
let speechGen = 0, voice503Streak = 0, voicePhoneOnly = false;
const voiceWarmed = new Set();
let voiceTourRun = "", voiceCardsKey = "";

function audioEl() {
  return document.getElementById("voiceAudio");
}

async function neuralUrl(text) {
  if (voiceCache.has(text)) return voiceCache.get(text);
  if (voicePhoneOnly) {
    const err = new Error("phone voice for this session");
    err.status = 503;
    throw err;
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch(`/api/voice?code=${encodeURIComponent(CODE)}`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: text, lang: LANG}),
      signal: ctrl.signal,
    });
    if (!r.ok) {
      const err = new Error("voice " + r.status);
      err.status = r.status;
      throw err;
    }
    const url = URL.createObjectURL(await r.blob());
    voiceCache.set(text, url);
    voiceOk = true;
    voice503Streak = 0;
    return url;
  } finally {
    clearTimeout(timer);
  }
}

function serverPrefetch(texts) {
  const fresh = [];
  for (const text of texts) {
    if (!text || voiceWarmed.has(text)) continue;
    voiceWarmed.add(text);
    fresh.push(text);
  }
  if (!fresh.length) return;
  for (let i = 0; i < fresh.length; i += 80) {
    fetch(`/api/voice/prefetch?code=${encodeURIComponent(CODE)}`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({lang: LANG, texts: fresh.slice(i, i + 80)}),
    }).catch(() => {});
  }
}

function warmShotLines() {
  if (!tour || !status) return;
  const skip = skippedSet();
  const remaining = tour.shots.filter(s =>
    !takenSet.has(s.shot_id) && !skip.has(s.shot_id));
  const cur = roundCurrent();
  const ordered = [];
  if (cur) ordered.push(cur);
  for (const shot of remaining) {
    if (!cur || shot.shot_id !== cur.shot_id) ordered.push(shot);
  }
  serverPrefetch(ordered.map(s => roomHeading(s) + ". " + instruction(s)));
}

function warmCardLines() {
  if (!tour || !status || screenOf() !== "cards") return;
  const byId = itemsById();
  const texts = [T().photosDone, T().doneAll];
  for (const id of cardOrder) {
    if (byId[id]) texts.push(cardText(byId[id]));
  }
  const key = texts.join("\n");
  if (key === voiceCardsKey) return;
  voiceCardsKey = key;
  serverPrefetch(texts);
}

function stopSpeech() {
  speechGen += 1;
  speechQueue.length = 0;
  speaking = false;
  if (speechTimer) { clearTimeout(speechTimer); speechTimer = null; }
  const el = audioEl();
  if (el) {
    el.onended = null;
    el.onerror = null;
    try {
      el.pause();
      el.removeAttribute("src");
      el.load();
    } catch (e) {}
  }
  if ("speechSynthesis" in window) {
    try { speechSynthesis.cancel(); } catch (e) {}
  }
}

function pumpSpeech() {
  if (speaking || !speechQueue.length) return;
  const gen = speechGen;
  const text = speechQueue[0];
  speaking = true;
  if (voicePhoneOnly && !voiceCache.has(text)) {
    speechQueue.shift();
    speaking = false;
    speakWithPhone(text, gen);
    return;
  }
  neuralUrl(text).then(url => {
    if (gen !== speechGen) return;
    const el = audioEl();
    const done = () => {
      if (gen !== speechGen) return;
      el.onended = el.onerror = null;
      speechQueue.shift();
      speaking = false;
      pumpSpeech();
    };
    const fail = () => {
      if (gen !== speechGen) return;
      el.onended = el.onerror = null;
      speechQueue.shift();
      speaking = false;
      speakWithPhone(text, gen);
    };
    el.onended = done;
    el.onerror = fail;
    el.src = url;
    el.currentTime = 0;
    const playing = el.play();
    if (playing && playing.catch) playing.catch(fail);
  }).catch(err => {
    if (gen !== speechGen) return;
    if (err && err.status === 503) {
      voice503Streak += 1;
      voiceOk = false;
      if (voice503Streak >= 3) voicePhoneOnly = true;
    }
    speechQueue.shift();
    speaking = false;
    speakWithPhone(text, gen);
  });
}

function speakWithPhone(text, gen) {
  if (gen === undefined) gen = speechGen;
  if (!("speechSynthesis" in window)) {
    speaking = false;
    pumpSpeech();
    return;
  }
  speaking = true;
  pickVoice();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang = (voice && voice.lang) || LANG;
  u.onend = u.onerror = () => {
    if (gen !== speechGen) return;
    speaking = false;
    if (speechTimer) { clearTimeout(speechTimer); speechTimer = null; }
    pumpSpeech();
  };
  if (speechTimer) clearTimeout(speechTimer);
  speechTimer = setTimeout(() => {
    // Some Android Chrome versions never fire onend: force-advance.
    speechTimer = null;
    if (gen !== speechGen) return;
    if (speaking) {
      speaking = false;
      try { speechSynthesis.cancel(); } catch (e) {}
      pumpSpeech();
    }
  }, 15000);
  speechSynthesis.speak(u);
}

function prefetchSpeech() {
  if (!tour || !status) return;
  const texts = [];
  const screen = screenOf();
  if (screen === "round") {
    for (const shot of tour.shots) {
      if (texts.length >= 2) break;
      if (takenSet.has(shot.shot_id) || skippedSet().has(shot.shot_id)) continue;
      texts.push(roomHeading(shot) + ". " + instruction(shot));
    }
  } else if (screen === "cards") {
    const byId = itemsById();
    for (const id of cardOrder.slice(0, 2)) {
      if (byId[id]) texts.push(cardText(byId[id]));
    }
  }
  for (const text of texts) {
    if (text) neuralUrl(text).catch(() => {});
  }
}

function silentClipUrl() {
  const rate = 8000, frames = Math.floor(rate * 0.05);
  const buf = new ArrayBuffer(44 + frames * 2);
  const v = new DataView(buf);
  const wstr = (off, s) => {
    for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i));
  };
  wstr(0, "RIFF"); v.setUint32(4, 36 + frames * 2, true); wstr(8, "WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  wstr(36, "data"); v.setUint32(40, frames * 2, true);
  return URL.createObjectURL(new Blob([buf], {type: "audio/wav"}));
}

function say(text) { speechQueue.push(text); pumpSpeech(); }
function sayNow(text) { stopSpeech(); say(text); }
function repeatSay(text) {
  stopSpeech();
  if (voiceCache.has(text)) {
    say(text);
  } else {
    speakWithPhone(text, speechGen);
  }
}

let audioCtx = null;
function chime() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    [660, 880].forEach((freq, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = freq;
      o.type = "sine";
      const at = t + i * 0.12;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.2, at + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.25);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(at);
      o.stop(at + 0.3);
    });
  } catch (e) {}
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  exit: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
};

function camLive() {
  return !!camStream && camStream.getTracks().some(t => t.readyState === "live");
}

function stopCamera() {
  if (camStream) {
    camStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    camStream = null;
  }
  camWide = false;
  camDeviceId = null;
  camWideShot = null;
  document.getElementById("camLayer").hidden = true;
}

async function startCamera() {
  if (camLive()) return true;
  if (camStarting) return false;
  if (DEMO || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    return false;
  }
  camStarting = true;
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: "environment", width: {ideal: 1920}, height: {ideal: 1440}},
      audio: false,
    });
    const track = camStream.getVideoTracks()[0];
    if (track && track.getSettings) camNormalId = track.getSettings().deviceId || null;
    camWideShot = null;
    return camLive();
  } catch (e) {
    stopCamera();
    return false;
  } finally {
    camStarting = false;
  }
}

function attachCamera() {
  const layer = document.getElementById("camLayer");
  const video = document.getElementById("camView");
  if (DEMO || camMode !== "live") {
    layer.hidden = true;
    return;
  }
  layer.hidden = false;
  if (camLive()) {
    if (video.srcObject !== camStream) video.srcObject = camStream;
    playQuiet(video);
    syncWideCamera();
    return;
  }
  startCamera().then(ok => {
    if (ok) {
      video.srcObject = camStream;
      playQuiet(video);
      syncWideCamera();
    }
    if (camMode === "live" && !ok && !camStarting) {
      camMode = "file";
      layer.hidden = true;
      lastKey = null;
      renderMaybe();
    }
  });
}

function cameraShot() {
  if (camSheet) return shotOfItem(camSheet.item);
  if (!tour || !status || screenOf() !== "round") return null;
  return roundCurrent();
}

function updateWidePills() {
  document.querySelectorAll(".widepill").forEach(el => { el.hidden = !camWide; });
}

async function applyZoom(want) {
  const track = camStream && camStream.getVideoTracks()[0];
  if (!track || !track.getCapabilities || !track.applyConstraints) return false;
  const caps = track.getCapabilities() || {};
  if (!caps.zoom) return false;
  if (want && !(caps.zoom.min < 1)) return false;
  try {
    await track.applyConstraints({advanced: [{zoom: want ? caps.zoom.min : 1}]});
  } catch (e) {
    return false;
  }
  return true;
}

async function switchCamera(want) {
  if (!(navigator.mediaDevices && navigator.mediaDevices.enumerateDevices)) return false;
  const devices = await navigator.mediaDevices.enumerateDevices();
  const backs = devices.filter(d => d.kind === "videoinput");
  let target = null;
  if (want) {
    target = backs.find(d => /ultra\s*wide/i.test(d.label || "")) || null;
  } else {
    target = backs.find(d => d.deviceId === camNormalId)
      || backs.find(d => !/ultra\s*wide/i.test(d.label || "")
        && /back|rear|environment/i.test(d.label || ""))
      || backs.find(d => !/ultra\s*wide/i.test(d.label || "")) || null;
  }
  if (!target || target.deviceId === camDeviceId) return false;
  const video = document.getElementById("camView");
  const old = camStream;
  const oldId = old && old.getVideoTracks()[0] && old.getVideoTracks()[0].getSettings
    ? old.getVideoTracks()[0].getSettings().deviceId : null;
  let fresh = null;
  try {
    fresh = await navigator.mediaDevices.getUserMedia({
      video: {deviceId: {exact: target.deviceId},
              width: {ideal: 1920}, height: {ideal: 1440}},
      audio: false,
    });
    video.srcObject = fresh;
    playQuiet(video);
    if (!await waitForVideo(video, 1500)) throw new Error("camera not ready");
    old.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    camStream = fresh;
    if (want) {
      camNormalId = oldId || camNormalId;
      camDeviceId = target.deviceId;
    } else {
      camDeviceId = null;
    }
    return true;
  } catch (e) {
    if (fresh) fresh.getTracks().forEach(t => { try { t.stop(); } catch (err) {} });
    let restored = false;
    if (old) {
      video.srcObject = old;
      playQuiet(video);
      restored = camLive();
    }
    if (!restored) {
      const restarted = await startCamera();
      if (restarted) {
        video.srcObject = camStream;
        playQuiet(video);
      } else {
        camMode = "file";
        document.getElementById("camLayer").hidden = true;
        lastKey = null;
        renderMaybe();
      }
    }
    return false;
  }
}

async function syncWideCamera() {
  if (!WIDE || DEMO || camMode !== "live" || !camLive() || camWideBusy) return;
  const shot = cameraShot();
  const shotId = shot ? shot.shot_id : null;
  const want = !!(shot && shot.overview);
  if (shotId === camWideShot) { updateWidePills(); return; }
  if (want && camWideImpossible) {
    camWideShot = shotId;
    updateWidePills();
    return;
  }
  if (want === camWide) {
    camWideShot = shotId;
    updateWidePills();
    return;
  }
  camWideShot = shotId;
  camWideBusy = true;
  const before = camWide;
  try {
    if (want) {
      let ok = await applyZoom(true);
      if (!ok) ok = await switchCamera(true);
      camWide = !!ok;
      if (!ok) camWideImpossible = true;
    } else if (camDeviceId) {
      const ok = await switchCamera(false);
      camWide = ok ? false : true;
    } else {
      const ok = await applyZoom(false);
      camWide = ok ? false : before;
    }
  } catch (e) {
    if (want) camWideImpossible = true;
    camWide = camDeviceId ? true : before;
  } finally {
    camWideBusy = false;
    updateWidePills();
    if (camWide !== before) {
      lastKey = null;
      renderMaybe();
    }
  }
}

function waitForVideo(video, ms) {
  return new Promise(resolve => {
    const t0 = Date.now();
    const check = () => {
      if (video.videoWidth) { resolve(true); return; }
      if (Date.now() - t0 >= ms) { resolve(false); return; }
      setTimeout(check, 100);
    };
    check();
  });
}

function playQuiet(video) {
  try {
    const pr = video.play();
    if (pr && pr.catch) pr.catch(() => {});
  } catch (e) {}
}

function flash() {
  const el = document.getElementById("flash");
  el.classList.remove("off");
  el.classList.add("on");
  setTimeout(() => {
    el.classList.remove("on");
    el.classList.add("off");
  }, 60);
}

function captureFrame(videoId) {
  return new Promise(resolve => {
    const video = document.getElementById(videoId);
    if (!video || !video.videoWidth) { resolve(null); return; }
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    canvas.toBlob(blob => {
      resolve(blob ? new File([blob], "shot.jpg", {type: "image/jpeg"}) : null);
    }, "image/jpeg", 0.9);
  });
}

async function shutterShot(shot) {
  stopSpeech();
  if (camMode !== "live" || !camLive()) {
    roundView = "card";
    lastKey = null;
    renderMaybe();
    openCamera(shot.shot_id);
    return;
  }
  const video = document.getElementById("camView");
  if (!video.videoWidth) {
    camWaiting = true;
    lastKey = null;
    renderMaybe();
    const ready = await waitForVideo(video, 1500);
    camWaiting = false;
    if (!ready || !camLive()) {
      roundView = "card";
      lastKey = null;
      renderMaybe();
      openCamera(shot.shot_id);
      return;
    }
  }
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  flash();
  roundView = "card";
  optimistic.set(shot.shot_id, {file: null, url: "", state: "encoding"});
  if (overrideShot === shot.shot_id) overrideShot = null;
  const next = roundCurrent();
  if (next && next.shot_id !== shot.shot_id) {
    prevShotId = next.shot_id;
    sayNow(roomHeading(next) + ". " + instruction(next));
  }
  lastKey = null;
  renderMaybe();
  canvas.toBlob(blob => {
    if (!blob) {
      optimistic.delete(shot.shot_id);
      lastKey = null;
      renderMaybe();
      return;
    }
    snapShot(shot, new File([blob], "shot.jpg", {type: "image/jpeg"}), true);
  }, "image/jpeg", 0.9);
}

function roomName(roomId) {
  for (const room of status.rooms) {
    if (room.id === roomId) return room.name;
  }
  return roomId;
}

function tourText(shot, base) {
  return shot[base + "_" + LANG] || shot[base + "_en"] || shot[base + "_es"] || "";
}

function roomHeading(shot) {
  return tourText(shot, "room_name") || roomName(shot.room_id);
}

function instruction(shot) {
  return tourText(shot, "instruction");
}

function shotOfItem(itemId) {
  // Fewest-items shot listing the item (ties: tour order), so a card
  // shows the close-up shot, not the room overview that lists it too.
  let best = null;
  for (const s of tour.shots) {
    if ((s.item_ids || []).indexOf(itemId) < 0) continue;
    if (!best || (s.item_ids || []).length < (best.item_ids || []).length) best = s;
  }
  return best;
}

function itemsById() {
  const map = {};
  for (const room of status.rooms) for (const item of room.items) map[item.id] = item;
  return map;
}

function shortName(shot) {
  const s = tourText(shot, "short") || roomHeading(shot);
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function skippedSet() {
  return new Set(((status || {}).skipped_shots || []));
}

function roundCurrent() {
  if (overrideShot) {
    const s = tour.shots.find(x => x.shot_id === overrideShot);
    if (s) return s;
    overrideShot = null;
  }
  const skip = skippedSet();
  return tour.shots.find(s =>
    !takenSet.has(s.shot_id) && !skip.has(s.shot_id) &&
    (!optimistic.has(s.shot_id) || optimistic.get(s.shot_id).state === "failed")
  ) || null;
}

function allTaken() {
  const skip = skippedSet();
  return tour.shots.length > 0 &&
    tour.shots.every(s => takenSet.has(s.shot_id) || skip.has(s.shot_id));
}

function shotForCard(itemId) {
  // Prefer the shot of the photo the card shows; fall back to the
  // fewest-items shot listing the item, then the room's first shot.
  const item = itemsById()[itemId];
  if (item && item.photo_id && status && status.recent) {
    const entry = status.recent.find(e => e.photo_id === item.photo_id);
    if (entry) {
      const shown = tour.shots.find(s => s.shot_id === entry.shot_id);
      if (shown) return shown;
    }
  }
  const direct = shotOfItem(itemId);
  if (direct) return direct;
  const roomId = itemId.split(".")[0];
  return tour.shots.find(s => s.room_id === roomId) || null;
}

function cardPhotoUrl(item) {
  if (item.has_evidence) {
    return `/api/runs/${encodeURIComponent(RUN)}/evidence/${encodeURIComponent(item.id)}?v=${encodeURIComponent(item.photo_id)}&card=1`;
  }
  if (item.photo_id) {
    return `/api/runs/${encodeURIComponent(RUN)}/photos/${encodeURIComponent(item.photo_id)}/overview`;
  }
  return "";
}

function cardText(item) {
  if (item.request && item.request.cleaner) return item.request.cleaner;
  const shot = shotOfItem(item.id);
  return shot ? instruction(shot) : item.label;
}

function cardGroups() {
  if (status && Array.isArray(status.card_groups) && status.card_groups.length) {
    return status.card_groups;
  }
  const byId = itemsById();
  return ((status && status.cards) || []).map(id => ({
    key: id, photo_id: byId[id] ? byId[id].photo_id : "",
    shot_id: "", item_ids: [id],
  }));
}

function groupOf(itemId) {
  return cardGroups().find(g => (g.item_ids || []).indexOf(itemId) >= 0) || null;
}

function shownGroup() {
  for (const id of cardOrder) {
    if (id in retakePhotos) continue;
    const g = groupOf(id) || {key: id, photo_id: "", shot_id: "", item_ids: [id]};
    const ids = (g.item_ids || []).filter(
      x => cardOrder.indexOf(x) >= 0 && !(x in retakePhotos));
    if (ids.length) {
      return {key: g.key, photo_id: g.photo_id, shot_id: g.shot_id, item_ids: ids};
    }
  }
  return null;
}

function shownCard() {
  const g = shownGroup();
  return g ? g.item_ids[0] : null;
}

function groupsRemaining() {
  const seen = new Set();
  let count = 0;
  for (const id of cardOrder) {
    if (id in retakePhotos) continue;
    const g = groupOf(id);
    const key = g ? g.key : id;
    if (!seen.has(key)) { seen.add(key); count++; }
  }
  return count;
}

function navPush(name, url) {
  navDepth++;
  if (url === undefined) history.pushState({pot: name}, "");
  else history.pushState({pot: name}, "", url);
}
function navReplace(name, url) {
  if (url === undefined) history.replaceState({pot: name}, "");
  else history.replaceState({pot: name}, "", url);
}
function applyNavState(name) {
  if (name !== "language" && name !== "choice" && name !== "houses") return;
  if (RUN) {
    if (status && status.finished_at) {
      newTurnover();
      return;
    }
    if (!confirm(T().exitConfirm)) {
      navPush("run");
      return;
    }
    RUN = "";
    modePicked = "turnover";
    resetRunState();
    const url = new URL(location.href);
    url.searchParams.delete("run");
    navReplace("houses", url);
    renderMaybe();
    return;
  }
  if (name === "language") {
    langPicked = false;
  } else if (name === "choice") {
    langPicked = true;
    modePicked = "";
  } else {
    langPicked = true;
    modePicked = "turnover";
  }
  lastKey = null;
  renderMaybe();
}


function skippedAreas() {
  return (status && status.skipped_areas) || [];
}

function skippedKey() {
  return skippedAreas().map(a => a.room_id).join(",");
}

function renderReminder(app) {
  const rows = skippedAreas().map(a => {
    const checks = (a.items || a.checks || []).join(", ");
    return `<div class="skiprow"><div class="skipmeta"><strong>${esc(a.room_name)}</strong>` +
    `<span class="small">${esc(T().photosCount(a.shots))}</span>` +
    (checks ? `<span class="small">${esc(checks)}</span>` : "") + `</div>` +
    `<button class="btn secondary" data-unskip="${esc(a.room_id)}">${esc(T().takePhotos)}</button></div>`;
  }).join("");
  app.innerHTML = `<div class="wrap"><h1>${esc(T().skippedTitle)}</h1>` +
    `<p class="centerline">${esc(T().skippedTakeLine)}</p>${rows}` +
    `<button class="btn" id="skipContinue">${esc(T().continueWithout)}</button></div>`;
  document.getElementById("skipContinue").onclick = () => {
    skipReminderKey = skippedKey();
    lastKey = null;
    renderMaybe();
  };
  app.querySelectorAll("[data-unskip]").forEach(btn => {
    btn.onclick = async () => {
      stopSpeech();
      try {
        await api(`/api/runs/${encodeURIComponent(RUN)}/unskip-room`, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({room_id: btn.dataset.unskip}),
        });
      } catch (e) { /* stay on the reminder; the poll will resync */ }
      prevShotId = null;
      await refresh();
    };
  });
}

function screenOf() {
  if (!RUN) return "start";
  if (!tour || !status) return "loading";
  if (status.finished_at) return "final";
  if ((allTaken() || status.round_ended) && skippedAreas().length
      && skipReminderKey !== skippedKey()) return "reminder";
  return (allTaken() || status.round_ended) ? "cards" : "round";
}

function voiceKey() {
  if (!("speechSynthesis" in window)) return "none";
  return speechSynthesis.getVoices().length;
}

function finalCounts() {
  let proven = 0, fixed = 0, cantFix = 0, fine = 0;
  for (const room of status.rooms) for (const item of room.items) {
    if (!item.critical) continue;
    if (item.status === "proven") proven++;
    if (item.has_before) fixed++;
    if (item.resolution) {
      if (item.resolution.action === "cant_fix") cantFix++;
      else fine++;
    }
  }
  return {proven: proven, fixed: fixed, cantFix: cantFix, fine: fine};
}

function renderKey() {
  const screen = screenOf();
  const base = [LANG, langPicked, modePicked, screen, skipReminderKey, skippedKey()];
  if (screen === "start") return JSON.stringify(base.concat([(LANGS || []).length]));
  if (screen === "loading") return JSON.stringify(base.concat([!!tour, !!status]));
  if (screen === "final") {
    const c = finalCounts();
    return JSON.stringify(base.concat([c.proven, c.fixed, c.cantFix, c.fine]));
  }
  // Only what the screen shows: polling every 0.5 s must not rebuild it
  // for news, photo_seconds or checking-list churn underneath.
  if (screen === "round") {
    const shot = roundCurrent();
    const p = status.progress;
    const last = lastTakenShot();
    const camera = roundView === "camera";
    const failed = Array.from(optimistic)
      .filter(([k, v]) => v.state === "failed").map(([k]) => k);
    return JSON.stringify(base.concat([
      shot ? shot.shot_id : null,
      camera ? null : p.shots_taken, p.shots_total,
      failed,
      camera ? null : (last ? last.shot_id : null),
      photoError, !!recorder, transcribing, noteMsg,
      camera ? null : selectedDemo, camera ? null : (demoPhotos || []).length,
      voiceKey(),
      (status.unchecked || []).length,
      (status.skipped_shots || []).join(","),
      camMode, camWaiting, camWide,
      roundView, roundView === "card" ? exState.big : null,
      camera ? null : lastPhotoUrl(),
    ]));
  }
  const byId = itemsById();
  const group = shownGroup();
  const shown = group ? group.item_ids[0] : null;
  const item = shown ? byId[shown] : null;
  const total = status.progress.photos, left = status.checking.length;
  return JSON.stringify(base.concat([
    shown,
    group ? group.item_ids.join(",") : null,
    group ? group.item_ids.map(id => byId[id] ? byId[id].status : "").join(",") : null,
    item ? cardText(item) : null,
    item ? cardPhotoUrl(item) : null,
    cardPanel, cardNoteId, cardNoteText,
    cardOrder.length, cardsTotal, groupsRemaining(),
    total - left, total,
    Object.values(retakePhotos).join(","),
    toast,
    !shown && !left,
    photoError, !!recorder, transcribing, noteMsg,
    selectedDemo, (demoPhotos || []).length,
    (status.unchecked || []).join(","),
    retrying,
  ]));
}

function syncExample() {
  if (!tour || screenOf() !== "round") return;
  const cur = roundCurrent();
  const id = cur ? cur.shot_id : null;
  if (id === exState.shot) return;
  if (exState.timer) {
    clearTimeout(exState.timer);
    exState.timer = null;
  }
  exState = {shot: id, big: !!(cur && exampleUrl(cur)), popAt: null, leaveAt: null,
               timer: null};
  if (exState.big) {
    exState.timer = setTimeout(() => {
      const pop = document.getElementById("exPop");
      if (pop) pop.classList.add("leave");
      exState.leaveAt = performance.now();
      exState.timer = setTimeout(() => {
        exState.timer = null;
        exState.big = false;
        lastKey = null;
        renderMaybe();
      }, 280);
    }, 2500);
  }
}

function renderMaybe() {
  syncExample();
  const key = renderKey();
  if (key === lastKey) return;
  lastKey = key;
  render();
}

function render() {
  syncExample();
  document.documentElement.lang = LANG;
  document.title = T().title;
  const app = document.getElementById("app");
  const screen = screenOf();
  if (prevScreen === "round" && screen !== "round" && !camSheet) stopCamera();
  prevScreen = screen;
  if (!RUN) return renderStart(app);
  if (!tour || !status) { app.innerHTML = `<div class="wrap"><p>${esc(T().loading)}</p></div>`; return; }
  let view;
  if (status.finished_at) view = renderFinal(app);
  else if (screen === "reminder") view = renderReminder(app);
  else if (!allTaken() && !status.round_ended) view = renderRound(app);
  else view = renderCards(app);
  prefetchSpeech();
  return view;
}

async function renderStart(app) {
  if (!langPicked) return renderLanguage(app);
  if (modePicked !== "turnover") return renderChoice(app);
  let props = [];
  try { props = (await api("/api/properties")).properties; } catch (e) { return fail(app, e); }
  const houses = props
    .filter(p => DEMO || p.id !== "demo-house")
    .sort((a, b) => (a.id === "demo-house") - (b.id === "demo-house"));
  const savedHouse = storeGet("pot-house");
  const options = houses.map(p =>
    `<option value="${esc(p.id)}"${p.id === savedHouse ? " selected" : ""}>${esc(p.name)}</option>`
  ).join("");
  app.innerHTML = `<div class="wrap">
    <div class="brand">${ICONS.home}<div class="wordmark">Proof of Turnover</div></div>
    <h1>${esc(T().title)}</h1>
    <label class="small" for="prop">${esc(T().house)}</label>
    <select id="prop">${options}</select>
    <button class="btn" id="start">${esc(T().start)}</button>
    <p><a href="#" id="toChoice" class="link">${ICONS.back}${esc(T().back)}</a></p>
    ${DEMO ? `<p class="small">${esc(T().demoNote)}</p>` : ""}
  </div>`;
  document.getElementById("start").onclick = startTour;
  document.getElementById("toChoice").onclick = ev => {
    ev.preventDefault();
    modePicked = "";
    navPush("choice");
    lastKey = null;
    renderMaybe();
  };
}

function renderChoice(app) {
  app.innerHTML = `<div class="wrap">
    <div class="brand">${ICONS.home}<div class="wordmark">Proof of Turnover</div></div>
    <button class="btn tile" id="goTurnover">${esc(T().startTurnover)}</button>
    <button class="btn secondary tile" id="goSetup">${esc(T().setupHouse)}</button>
    <p class="langline"><a href="#" id="changeLang" class="link">Idioma · Language · Язык</a></p>
  </div>`;
  document.getElementById("goTurnover").onclick = () => {
    modePicked = "turnover";
    navPush("houses");
    lastKey = null;
    renderMaybe();
  };
  const setupBtn = document.getElementById("goSetup");
  if (setupBtn) setupBtn.onclick = () => {
    location.href = setupHref();
  };
  document.getElementById("changeLang").onclick = ev => {
    ev.preventDefault();
    langPicked = false;
    navPush("language");
    lastKey = null;
    renderMaybe();
  };
}

function setupHref() {
  let url = `/setup?code=${encodeURIComponent(CODE)}`;
  if (DEMO) url += "&demo=1";
  if (TEST) url += "&test=1";
  return url;
}

async function renderLanguage(app) {
  if (LANGS === null) {
    try { LANGS = (await api("/api/languages")).languages; }
    catch (e) { return fail(app, e); }
  }
  try { role = (await api(`/api/role?code=${encodeURIComponent(CODE)}`)).role; } catch (e) { role = null; }
  const saved = loadSavedLang();
  const buttons = LANGS.map(l =>
    `<button class="btn${l.code === saved ? " saved" : ""}" data-lang="${esc(l.code)}">${esc(l.name)}</button>`
  ).join("");
  app.innerHTML = `<div class="wrap">
    <div class="brand">${ICONS.home}<div class="wordmark">Proof of Turnover</div></div>
    <h1>Idioma · Language · Язык</h1>${buttons}
  </div>`;
  app.querySelectorAll("[data-lang]").forEach(b => {
    b.onclick = () => {
      LANG = b.getAttribute("data-lang");
      saveLang(LANG);
      pickVoice();
      say(T().greeting);
      langPicked = true;
      navPush("choice");
      lastKey = null;
      renderMaybe();
    };
  });
}

function resetRunState() {
  skipReminderKey = "";
  skipReminderSpokenKey = "";
  stopSpeech();
  voiceWarmed.clear();
  voiceTourRun = "";
  voiceCardsKey = "";
  stopCamera();
  camSheet = null;
  camMode = "live";
  camWaiting = false;
  roundView = "card";
  if (exState.timer) clearTimeout(exState.timer);
  exState = {shot: null, big: false, popAt: null, leaveAt: null, timer: null};
  document.getElementById("sheet").hidden = true;
  document.body.classList.remove("sheet-open");
  for (const entry of optimistic.values()) {
    try { URL.revokeObjectURL(entry.url); } catch (e) {}
  }
  tour = null;
  tourRun = "";
  takenSet = new Set();
  status = null;
  overrideShot = null;
  photoError = "";
  pendingShot = null;
  pendingCard = null;
  prevShotId = null;
  noteMsg = "";
  optimistic = new Map();
  cardOrder = [];
  retakePhotos = {};
  spokenCard = null;
  lastShownCard = null;
  cardsTotal = 0;
  photosDoneSaid = false;
  saidFinal = false;
  cardPanel = null;
  cardNoteId = null;
  cardNoteText = "";
  panelFresh = false;
  toast = null;
  retrying = false;
  lastKey = null;
}

async function startTour() {
  say(T().hello);
  const app = document.getElementById("app");
  const property = document.getElementById("prop").value;
  storeSet("pot-house", property);
  app.innerHTML = `<div class="wrap"><p>${esc(T().starting)}</p></div>`;
  try {
    const created = await api("/api/runs", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({property: property, demo: DEMO, test: TEST || DEMO, language: LANG}),
    });
    RUN = created.run_id;
    resetRunState();
    const url = new URL(location.href);
    url.searchParams.set("run", RUN);
    navPush("run", url);
    await refresh();
    startPoll();
    lockScreen();
    const shot = roundCurrent();
    if (shot) {
      prevShotId = shot.shot_id;
      sayNow(roomHeading(shot) + ". " + instruction(shot));
    }
    renderMaybe();
  } catch (e) { fail(app, e); }
}

function showBig(url, caption) {
  document.getElementById("big").src = url;
  document.getElementById("bigcap").textContent = caption || "";
  document.getElementById("overlay").style.display = "block";
}

function exampleUrl(shot) {
  return shot && shot.example_url
    ? `${shot.example_url}?code=${encodeURIComponent(CODE)}` : "";
}

function micReady() {
  return !!window.isSecureContext && "MediaRecorder" in window &&
    !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

function fmtTime(seconds) {
  const m = Math.floor(seconds / 60), s = seconds % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function micHtml(stopId, startId) {
  if (recorder) {
    return `<button class="pillbtn rec" id="${stopId}">${ICONS.stop}<span>${esc(T().stop)}</span><span class="t">${esc(fmtTime(recSeconds))}</span></button>`;
  }
  if (micReady()) {
    return `<button class="pillbtn" id="${startId}">${ICONS.mic}<span>${esc(T().mic)}</span></button>`;
  }
  return "";
}

function cameraHtml(label, pickId, snapId) {
  if (DEMO) {
    const options = (demoPhotos || []).map(p => {
      const sel = p.url === selectedDemo ? " selected" : "";
      return `<option value="${esc(p.url)}"${sel}>${esc(p.name)}</option>`;
    }).join("");
    return `<label class="small" for="${pickId}">${esc(T().demoPhoto)}</label>
      <select id="${pickId}">${options}</select>
      <button class="btn" id="${snapId}">${esc(label)}</button>`;
  }
  return `<button class="camera" id="${snapId}">${esc(label)}</button>`;
}

function uncheckedCount() {
  return (status.unchecked || []).length;
}

function uncheckedLineHtml() {
  if (!uncheckedCount()) return "";
  return `<div class="pill warn">${esc(T().uncheckedLine)}</div>`;
}

function sendingHtml() {
  const rows = [];
  for (const [shotId, entry] of optimistic) {
    if (entry.state !== "failed") continue;
    rows.push(`<div class="pill warn"><button data-retry="${esc(shotId)}">${esc(T().notSent)}</button></div>`);
  }
  return rows.join("");
}

function lastTakenShot() {
  const taken = tour.shots.filter(s => takenSet.has(s.shot_id));
  return taken.length ? taken[taken.length - 1] : null;
}

function lastPhotoUrl() {
  const last = lastTakenShot();
  if (!last) return "";
  const entry = (status.recent || []).find(e => e.shot_id === last.shot_id);
  if (!entry) return "";
  return `/api/runs/${encodeURIComponent(RUN)}/photos/${encodeURIComponent(entry.photo_id)}/overview`;
}

function renderRound(app) {
  if (roundView === "camera") return renderCameraView(app);
  return renderCardView(app);
}

function roundMsgs() {
  let msgs = uncheckedLineHtml() + sendingHtml();
  if (camWaiting) msgs += `<div class="pill">${esc(T().camStarting)}</div>`;
  if (transcribing) msgs += `<div class="pill">${esc(T().transcribing)}</div>`;
  if (noteMsg) msgs += `<div class="pill">${esc(noteMsg)}</div>`;
  if (!micReady() && !recorder) msgs += `<div class="pill">${esc(T().insecure)}</div>`;
  if (voiceMissing() && voiceOk !== true) msgs += `<div class="pill">${esc(T().noVoice)}</div>`;
  if (photoError) msgs += `<div class="pill warn">${esc(photoError)}</div>`;
  return msgs;
}

function wireRetries(app) {
  app.querySelectorAll("[data-retry]").forEach(b => {
    b.onclick = () => {
      const shotId = b.getAttribute("data-retry");
      const entry = optimistic.get(shotId);
      if (entry) {
        entry.state = "sending";
        renderMaybe();
        sendShot(shotId, entry.file);
      }
    };
  });
}

function renderCardView(app) {
  const shot = roundCurrent();
  const p = status.progress;
  const pct = p.shots_total ? Math.round(100 * p.shots_taken / p.shots_total) : 0;
  const ex = exampleUrl(shot);
  const lastUrl = lastPhotoUrl();
  const last = lastTakenShot();
  const prompt = shot ? instruction(shot) : T().checking;
  let exHtml = "";
  if (ex) {
    if (exState.big) {
      if (exState.popAt === null) exState.popAt = performance.now();
      const age = Math.round(performance.now() - exState.popAt);
      const inner = `<img src="${esc(ex)}" alt=""><span class="chip2">${esc(T().shouldLook)}</span>`;
      if (exState.leaveAt !== null) {
        const back = Math.min(Math.round(performance.now() - exState.leaveAt), 280);
        exHtml = `<button class="expop big leave" id="exPop" style="animation-delay:-${back}ms">${inner}</button>`;
      } else if (age < 340) {
        exHtml = `<button class="expop big pop" id="exPop" style="animation-delay:-${age}ms">${inner}</button>`;
      } else {
        exHtml = `<button class="expop big" id="exPop">${inner}</button>`;
      }
    } else {
      exHtml = `<button class="expop small" id="exPop"><img src="${esc(ex)}" alt=""></button>`;
    }
  }
  const tucked = ex && !exState.big ? " tucked" : "";
  const skipLink = shot ? `<button class="link" id="skipShot">${esc(T().skipTest)}</button>` : "";
  const testrow = (TEST || DEMO)
    ? `<div class="testrow">${skipLink}<a href="#" id="finishEarly" class="small">${esc(T().finishEarly)}</a></div>`
    : (skipLink ? `<div class="testrow">${skipLink}</div>` : "");
  let take = "";
  if (shot && !DEMO) {
    take = `<button class="btn" id="takePhoto">${ICONS.camera}${esc(T().take)}</button>`;
  } else if (shot) {
    take = `<div class="demobox">${cameraHtml(T().take, "demoPick", "snapCam")}</div>`;
  }
  app.innerHTML = `<div class="rcard"><div class="inner">
    <div class="rhead">
      <button class="iconbtn small" id="exitLink" aria-label="${esc(T().exit)}">${ICONS.exit}</button>
      <span class="room">${shot ? esc(roomHeading(shot)) : ""}</span>
      <span class="count">${esc(T().ofTotal(p.shots_taken, p.shots_total))}</span>
    </div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="shotcard${tucked}">
      <div class="instruction${prompt.length > 90 ? " long" : ""}">${esc(prompt)}</div>
      ${exHtml}
    </div>
    ${shot ? `<div class="pillrow"><button class="pillbtn" id="repeat">${ICONS.speaker}<span>${esc(T().repeat)}</span></button>${micHtml("micStop", "micStart")}</div>` : ""}
    ${testrow}
    ${roundMsgs()}
  </div></div>
  <div class="takebar"><div class="takerow">
    ${lastUrl ? `<button class="lastshot" id="retakeLast" aria-label="${esc(T().retakeLast)}"><img src="${esc(lastUrl)}" alt=""><span class="check">✓</span></button>` : ""}
    ${take}
  </div></div>`;
  document.getElementById("exitLink").onclick = () => {
    if (confirm(T().exitConfirm)) newTurnover();
  };
  const early = document.getElementById("finishEarly");
  if (early) early.onclick = ev => {
    ev.preventDefault();
    if (confirm(T().finishEarlyConfirm)) endRound();
  };
  const exPop = document.getElementById("exPop");
  if (exPop) exPop.onclick = () => showBig(ex, T().howShould);
  if (shot) {
    document.getElementById("repeat").onclick = () =>
      repeatSay(roomHeading(shot) + ". " + instruction(shot));
    if (DEMO) {
      wireDemo("demoPick", "snapCam", file => snapShot(shot, file));
    } else {
      document.getElementById("takePhoto").onclick = () => {
        if (camMode === "live") {
          roundView = "camera";
          lastKey = null;
          renderMaybe();
        } else {
          openCamera(shot.shot_id);
        }
      };
    }
    const micStart = document.getElementById("micStart");
    if (micStart) micStart.onclick = () => startRec(shot.room_id, null, null);
    const micStop = document.getElementById("micStop");
    if (micStop) micStop.onclick = stopRec;
    const skipBtn = document.getElementById("skipShot");
    if (skipBtn) skipBtn.onclick = () => skipShot(shot.shot_id);
  }
  const retryLast = document.getElementById("retakeLast");
  if (retryLast) retryLast.onclick = () => { overrideShot = last.shot_id; renderMaybe(); };
  wireRetries(app);
  attachCamera();
}

function renderCameraView(app) {
  const shot = roundCurrent();
  const nocam = DEMO || camMode !== "live";
  const center = nocam ? `<div class="novid">${esc(T().camHint)}</div>` : "";
  const ex = exampleUrl(shot);
  const prompt = shot ? instruction(shot) : T().checking;
  app.innerHTML = `<div class="round${nocam ? " nocam" : ""}">${center}
    <div class="camtop">
      <button class="iconbtn small" id="camClose" aria-label="${esc(T().close)}">${ICONS.x}</button>
      <div class="instruction">${esc(prompt)}</div>
      ${ex ? `<button class="exthumb" id="exBtn" aria-label="${esc(T().howShould)}"><img src="${esc(ex)}" alt=""></button>` : ""}
    </div>
    <div class="roundmsg">${roundMsgs()}</div>
    ${camWide ? `<div class="widepill">${esc(T().wide)}</div>` : ""}
    <div class="cambar">
      ${shot ? `<button class="shutter" id="snapCam" aria-label="${esc(T().take)}"><span></span></button>` : ""}
    </div>
  </div>`;
  document.getElementById("camClose").onclick = () => {
    roundView = "card";
    lastKey = null;
    renderMaybe();
  };
  const exBtn = document.getElementById("exBtn");
  if (exBtn) exBtn.onclick = () => showBig(ex, T().howShould);
  if (shot) {
    document.getElementById("snapCam").onclick = () => shutterShot(shot);
  }
  wireRetries(app);
  attachCamera();
