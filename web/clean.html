<!DOCTYPE html>

<style>
  :root {
    --linen: #F2F3F5; --ink: #1F2328; --haint: #D6DCE4; --marsh: #3D4756;
    --marsh-dark: #2C3440; --brick: #A8554C; --dune: #9A7F4E; --dune-bg: #F1ECE2;
    --white: #FFFFFF; --muted: #6A707A; --line: #E1E4E8;
    --float-shadow: 0 8px 28px rgba(31, 35, 40, 0.16);
  }
  * { box-sizing: border-box; }
  body { font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
         margin: 0; background: var(--linen); color: var(--ink);
         font-size: 17px; line-height: 24px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 32px; }
  h1 { font-size: 22px; line-height: 28px; margin: 8px 0 16px; }
  :focus-visible { outline: 3px solid var(--marsh); outline-offset: 2px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px;
         overflow: hidden; margin: 8px 0 0; }
  .bar > div { height: 100%; background: var(--haint); border-radius: 3px; }
  .instruction { font-size: 26px; line-height: 31px; margin: 4px 0 12px; font-weight: 700; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px;
         width: 100%; padding: 16px; margin: 10px 0; font-size: 18px; font-weight: 700;
         font-family: inherit; min-height: 56px; border: none; border-radius: 20px;
         background: var(--marsh); color: var(--white); cursor: pointer; text-align: center; }
  .btn.secondary { background: var(--white); color: var(--ink);
                   border: 2px solid var(--line); }
  .btn.saved { outline: 3px solid var(--marsh); outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; }
  .btn svg, .iconbtn svg, .link svg { flex: none; }
  .result { border-radius: 20px; padding: 14px 16px; margin: 12px 0; font-size: 17px; }
  .result.ok { background: var(--haint); color: var(--ink); }
  .result.bad { background: #F3E1DD; }
  .result.wait { background: var(--dune-bg); }
  select, input[type=text] { font-size: 17px; padding: 12px; width: 100%; margin: 6px 0;
         border-radius: 20px; border: 2px solid var(--line); background: var(--white);
         color: var(--ink); font-family: inherit; min-height: 56px; }
  .error { background: #F3E1DD; border-radius: 20px; padding: 14px 16px; margin: 12px 0; }
  .small { font-size: 14px; line-height: 19px; color: var(--muted); }
  .link { display: inline-flex; align-items: center; gap: 6px; background: none;
          border: none; color: var(--marsh); font-size: 16px; font-weight: 700;
          font-family: inherit; cursor: pointer; padding: 12px 4px; min-height: 48px; }
  .brand { text-align: center; margin: 32px 0 24px; }
  .brand svg { color: var(--marsh); }
  .brand .wordmark { font-size: 22px; line-height: 28px; font-weight: 700; margin-top: 8px; }
  .tile { min-height: 88px; font-size: 20px; }
  .langline { text-align: center; margin-top: 24px; }
  /* Round: full-bleed camera */
  #camLayer[hidden] { display: none; }
  #camLayer { position: fixed; inset: 0; background: #121417; }
  #camLayer video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .round { position: fixed; inset: 0; background: transparent; overflow: hidden; }
  .round.nocam { background: #121417; }
  .round .novid, #sheet .novid { position: absolute; inset: 0; display: flex; align-items: center;
                  justify-content: center; color: var(--white); font-size: 17px;
                  padding: 24px; text-align: center; }
  .topcard { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px;
             background: rgba(255, 255, 255, 0.78);
             -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
             border-radius: 20px; box-shadow: var(--float-shadow); padding: 12px 16px; }
  .topcard .row1 { display: flex; align-items: center; gap: 12px; }
  .topcard .room { font-size: 17px; font-weight: 700; flex: 1; }
  .topcard .count { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .topcard .instruction { font-size: 26px; line-height: 31px; margin: 6px 0 2px; }
  .topcard .instruction.long { font-size: 22px; line-height: 27px; }
  .iconbtn { display: inline-flex; align-items: center; justify-content: center;
             width: 52px; height: 52px; border-radius: 50%; border: none;
             background: var(--white); color: var(--ink); cursor: pointer;
             box-shadow: var(--float-shadow); font-family: inherit; }
  .iconbtn.small { width: 44px; height: 44px; box-shadow: none;
                   border: 2px solid var(--line); }
  .iconbtn.rec { background: var(--brick); color: var(--white); }
  .iconbtn .t { font-size: 12px; font-weight: 700; margin-left: 2px; }
  .bottombar { position: absolute; left: 0; right: 0;
               bottom: max(12px, env(safe-area-inset-bottom));
               display: flex; align-items: flex-end; justify-content: space-around;
               padding: 0 16px; }
  .shutter { width: 78px; height: 78px; border-radius: 50%; cursor: pointer;
             background: var(--white); border: none; padding: 7px;
             box-shadow: var(--float-shadow); }
  .shutter span { display: block; width: 100%; height: 100%; border-radius: 50%;
                  background: var(--marsh); }
  .shutter:active span { background: var(--marsh-dark); }
  .exthumb, .lastshot { position: relative; width: 72px; height: 72px; border-radius: 18px;
             overflow: hidden; border: 3px solid var(--white); padding: 0; cursor: pointer;
             background: var(--muted); box-shadow: var(--float-shadow); }
  .exthumb img, .lastshot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .excol { display: flex; flex-direction: column; align-items: center; }
  .excap { font-size: 11px; line-height: 14px; color: var(--white); margin-top: 2px;
           text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6); }
  .lastshot .check { position: absolute; right: 2px; bottom: 2px; background: var(--marsh);
             color: var(--white); border-radius: 50%; width: 26px; height: 26px;
             font-size: 16px; line-height: 26px; text-align: center; }
  .sidecol { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .roundmsg { position: absolute; left: 12px; right: 12px; bottom: 116px; display: flex;
              flex-direction: column; gap: 8px; align-items: center;
              pointer-events: none; }
  .roundmsg > * { pointer-events: auto; }
  .pill { background: rgba(255, 255, 255, 0.92); border-radius: 20px;
          padding: 10px 16px; font-size: 14px; max-width: 100%; }
  .pill.warn { background: var(--dune-bg); }
  .pill button { font: inherit; color: inherit; background: none; border: none;
                 padding: 0; cursor: pointer; text-align: left; }
  .testrow { display: flex; gap: 20px; margin-top: 6px; }
  .testrow .link, .testrow a { font-size: 14px; color: var(--marsh); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0;
           pointer-events: none; z-index: 40; }
  #flash.on { opacity: 1; transition: none; }
  #flash.off { opacity: 0; transition: opacity 180ms ease-out; }
  /* Cards */
  .cardshead { margin: 8px 0 4px; }
  .cardshead h1 { margin: 0; }
  .cardshead .left { font-size: 17px; color: var(--muted); margin: 2px 0 12px; }
  .stack { position: relative; margin: 0 0 32px; }
  .peek { position: absolute; left: 0; right: 0; bottom: -12px; height: 60px;
          background: var(--white); border-radius: 20px; }
  .peek.p1 { transform: scale(0.96); bottom: -12px; opacity: 0.8; }
  .peek.p2 { transform: scale(0.92); bottom: -22px; opacity: 0.5; }
  .card { position: relative; background: var(--white); border-radius: 20px;
          padding: 16px; }
  .card.slide { animation: slidein 250ms ease-out; }
  .card.out { animation: flyout 220ms ease-in forwards; }
  @keyframes slidein {
    from { transform: translateX(60px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  @keyframes flyout {
    to { transform: translateX(-60px) scale(0.94); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card.slide, .card.out { animation: none; }
    #flash.on, #flash.off { transition: none; }
    .stamp { animation: none; }
  }
  .tagrow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .tag { display: inline-block; border-radius: 999px; padding: 6px 14px;
         font-size: 14px; font-weight: 700; }
  .tag.fix { background: var(--brick); color: var(--white); }
  .tag.missing { background: var(--dune-bg); color: var(--ink);
                 border: 2px solid var(--dune); }
  .tagrow .of { margin-left: auto; font-size: 14px; color: var(--muted); }
  .photowrap { position: relative; margin: 0 0 12px; }
  .photowrap img.photo { width: 100%; border-radius: 20px; cursor: zoom-in; display: block; }
  .inset { position: absolute; right: 8px; bottom: 8px; width: 96px; cursor: zoom-in;
           background: var(--white); border-radius: 12px; padding: 4px;
           box-shadow: var(--float-shadow); border: none; }
  .inset img { width: 100%; border-radius: 8px; display: block; }
  .inset span { display: block; font-size: 11px; line-height: 14px; padding: 2px 4px;
                color: var(--muted); }
  .card .instruction { font-size: 22px; line-height: 28px; }
  .btnrow { display: flex; gap: 10px; }
  .btnrow .btn { margin: 10px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip { border: 2px solid var(--line); border-radius: 999px; background: var(--white);
          color: var(--ink); font-size: 16px; font-family: inherit;
          padding: 10px 16px; min-height: 48px; cursor: pointer; }
  .toast { position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
           background: var(--marsh); color: var(--white); font-size: 17px; font-weight: 700;
           border-radius: 999px; padding: 12px 22px; z-index: 50;
           box-shadow: var(--float-shadow); white-space: nowrap; }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(18, 20, 23, 0.9);
             cursor: zoom-out; z-index: 60; text-align: center; padding: 48px 24px 24px; }
  #overlay img { max-width: 95%; max-height: 85%; border-radius: 20px; }
  #bigcap { color: var(--white); font-size: 17px; margin-top: 12px; }
  /* Retake sheet */
  #sheet[hidden] { display: none; }
  #sheet { position: fixed; inset: 0; z-index: 30; background: transparent; }
  #sheet.nocam { background: #121417; }
  #sheet .sheettop { position: absolute; top: max(12px, env(safe-area-inset-top));
             left: 12px; right: 12px; background: rgba(255, 255, 255, 0.78);
             -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
             border-radius: 20px; box-shadow: var(--float-shadow); padding: 12px 16px; }
  #sheet .sheetrow { display: flex; gap: 12px; align-items: center; }
  #sheet .instruction { font-size: 22px; line-height: 28px; margin: 8px 0 0; flex: 1; }
  #sheet .exthumb { flex: none; }
  #sheet .sheetbar { position: absolute; left: 0; right: 0;
             bottom: max(24px, env(safe-area-inset-bottom));
             display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 10px; }
  /* Final */
  .stampwrap { text-align: center; margin: 40px 0 24px; }
  .stamp { display: inline-flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 4px; width: 208px; height: 208px;
           border-radius: 50%; background: var(--white);
           border: 10px solid var(--haint); color: var(--marsh);
           font-size: 20px; font-weight: 700; line-height: 24px;
           animation: stampin 300ms ease-out; }
  @keyframes stampin {
    from { transform: scale(1.15); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .stats { list-style: none; margin: 0 0 16px; padding: 0; }
  .stats li { background: var(--white); border-radius: 20px; padding: 14px 16px;
              margin: 8px 0; font-size: 17px; }

async function api(path, opts) {
  const r = await fetch(path, opts || {});
  if (r.status === 401) throw new Error("auth");
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return r.json();
}

const UPLOAD_TIMEOUT_MS = 30000;
async function apiUpload(path, opts) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), UPLOAD_TIMEOUT_MS);
  try {
    return await api(path, {...(opts || {}), signal: ctrl.signal});
  } finally {
    clearTimeout(timer);
  }
}

const VOICE_PREFS = {es: ["es-us", "es-mx"], en: ["en-us"], ru: ["ru-ru"]};
let voice = null;
function pickVoice() {
  voice = null;
  if (!("speechSynthesis" in window)) return;
  const all = speechSynthesis.getVoices() || [];
  const mine = all.filter(
    v => v.lang && v.lang.toLowerCase().startsWith(LANG));
  for (const pref of (VOICE_PREFS[LANG] || [])) {
    voice = mine.find(v => v.lang.toLowerCase() === pref) || null;
    if (voice) break;
  }
  voice = voice || mine[0] || null;
}
function voiceMissing() {
  if (!("speechSynthesis" in window)) return false;
  const all = speechSynthesis.getVoices() || [];
  if (!all.length) return false; // voices not loaded yet
  pickVoice();
  return !voice;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = () => { pickVoice(); renderMaybe(); };
}
const speechQueue = [];
let speaking = false;
let speechTimer = null;
function pumpSpeech() {
  if (speaking || !speechQueue.length || !("speechSynthesis" in window)) return;
  speaking = true;
  const u = new SpeechSynthesisUtterance(speechQueue.shift());
  if (voice) u.voice = voice;
  u.lang = (voice && voice.lang) || LANG;
  u.onend = u.onerror = () => {
    speaking = false;
    if (speechTimer) { clearTimeout(speechTimer); speechTimer = null; }
    pumpSpeech();
  };
  if (speechTimer) clearTimeout(speechTimer);
  speechTimer = setTimeout(() => {
    // Some Android Chrome versions never fire onend: force-advance.
    speechTimer = null;
    if (speaking) {
      speaking = false;
      try { speechSynthesis.cancel(); } catch (e) {}
      pumpSpeech();
    }
  }, 15000);
  speechSynthesis.speak(u);
}
function say(text) { speechQueue.push(text); pumpSpeech(); }
function repeatSay(text) {
  speechQueue.length = 0;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  speaking = false;
  say(text);
}

let wakeLock = null;

let audioCtx = null;
function chime() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    [660, 880].forEach((freq, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = freq;
      o.type = "sine";
      const at = t + i * 0.12;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.2, at + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.25);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(at);
      o.stop(at + 0.3);
    });
  } catch (e) {}
}

function esc(s) {

function camLive() {
  return !!camStream && camStream.getTracks().some(t => t.readyState === "live");
}

function stopCamera() {
  if (camStream) {
    camStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
    camStream = null;
  }
  document.getElementById("camLayer").hidden = true;
}

async function startCamera() {
  if (camLive()) return true;
  if (camStarting) return false;
  if (DEMO || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    return false;
  }
  camStarting = true;
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: "environment", width: {ideal: 1920}, height: {ideal: 1440}},
      audio: false,
    });
    return camLive();
  } catch (e) {
    stopCamera();
    return false;
  } finally {
    camStarting = false;
  }
}

function attachCamera() {
  const layer = document.getElementById("camLayer");
  const video = document.getElementById("camView");
  if (DEMO || camMode !== "live") {
    layer.hidden = true;
    return;
  }
  layer.hidden = false;
  if (camLive()) {
    if (video.srcObject !== camStream) video.srcObject = camStream;
    playQuiet(video);
    return;
  }
  startCamera().then(ok => {
    if (ok) {
      video.srcObject = camStream;
      playQuiet(video);
    }
    if (camMode === "live" && !ok && !camStarting) {
      camMode = "file";
      layer.hidden = true;
      lastKey = null;
      renderMaybe();
    }
  });
}

function waitForVideo(video, ms) {
  return new Promise(resolve => {
    const t0 = Date.now();
    const check = () => {
      if (video.videoWidth) { resolve(true); return; }
      if (Date.now() - t0 >= ms) { resolve(false); return; }
      setTimeout(check, 100);
    };
    check();
  });
}

function playQuiet(video) {
  try {
    const pr = video.play();
    if (pr && pr.catch) pr.catch(() => {});
  } catch (e) {}
}

function flash() {
  const el = document.getElementById("flash");
  el.classList.remove("off");
  el.classList.add("on");
  setTimeout(() => {
    el.classList.remove("on");
    el.classList.add("off");
  }, 60);
}

function captureFrame(videoId) {
  return new Promise(resolve => {
    const video = document.getElementById(videoId);
    if (!video || !video.videoWidth) { resolve(null); return; }
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    canvas.toBlob(blob => {
      resolve(blob ? new File([blob], "shot.jpg", {type: "image/jpeg"}) : null);
    }, "image/jpeg", 0.9);
  });
}

async function shutterShot(shot) {
  if (camMode !== "live" || !camLive()) {
    openCamera(shot.shot_id);
    return;
  }
  const video = document.getElementById("camView");
  if (!video.videoWidth) {
    camWaiting = true;
    lastKey = null;
    renderMaybe();
    const ready = await waitForVideo(video, 1500);
    camWaiting = false;
    if (!ready || !camLive()) {
      lastKey = null;
      renderMaybe();
      openCamera(shot.shot_id);
      return;
    }
  }
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  flash();
  optimistic.set(shot.shot_id, {file: null, url: "", state: "encoding"});
  if (overrideShot === shot.shot_id) overrideShot = null;
  const next = roundCurrent();
  if (next && next.shot_id !== shot.shot_id) {
    prevShotId = next.shot_id;
    say(roomHeading(next) + ". " + instruction(next));
  }
  lastKey = null;
  renderMaybe();
  canvas.toBlob(blob => {
    if (!blob) {
      optimistic.delete(shot.shot_id);
      lastKey = null;
      renderMaybe();
      return;
    }
    snapShot(shot, new File([blob], "shot.jpg", {type: "image/jpeg"}), true);
  }, "image/jpeg", 0.9);
}

function roomName(roomId) {
  for (const room of status.rooms) {
    if (room.id === roomId) return room.name;
  }
  return roomId;
}

function tourText(shot, base) {
  return shot[base + "_" + LANG] || shot[base + "_en"] || shot[base + "_es"] || "";
}

function roomHeading(shot) {
  return tourText(shot, "room_name") || roomName(shot.room_id);
}

function instruction(shot) {
  return tourText(shot, "instruction");
}

function shotOfItem(itemId) {
  for (const s of tour.shots) {
    if ((s.item_ids || []).indexOf(itemId) >= 0) return s;
  }
  return null;
}

function itemsById() {
  const map = {};
  for (const room of status.rooms) for (const item of room.items) map[item.id] = item;
  return map;
}

function shortName(shot) {
  const s = tourText(shot, "short") || roomHeading(shot);
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function skippedSet() {
  return new Set(((status || {}).skipped_shots || []));
}

function roundCurrent() {
  if (overrideShot) {
    const s = tour.shots.find(x => x.shot_id === overrideShot);
    if (s) return s;
    overrideShot = null;
  }
  const skip = skippedSet();
  return tour.shots.find(s =>
    !takenSet.has(s.shot_id) && !skip.has(s.shot_id) &&
    (!optimistic.has(s.shot_id) || optimistic.get(s.shot_id).state === "failed")
  ) || null;
}

function allTaken() {
  const skip = skippedSet();
  return tour.shots.length > 0 &&
    tour.shots.every(s => takenSet.has(s.shot_id) || skip.has(s.shot_id));
}

function shotForCard(itemId) {
  const direct = shotOfItem(itemId);
  if (direct) return direct;
  const roomId = itemId.split(".")[0];
  return tour.shots.find(s => s.room_id === roomId) || null;

function cardPhotoUrl(item) {

    return `/api/runs/${encodeURIComponent(RUN)}/evidence/${encodeURIComponent(item.id)}?v=${encodeURIComponent(item.photo_id)}&card=1`;
  }
  if (item.photo_id) {
    return `/api/runs/${encodeURIComponent(RUN)}/photos/${encodeURIComponent(item.photo_id)}/overview`;
  }
  return "";
}

function cardText(item) {
  if (item.request && item.request.cleaner) return item.request.cleaner;
  const shot = shotOfItem(item.id);
  return shot ? instruction(shot) : item.label;
}

function shownCard() {

function navPush(name, url) {
  navDepth++;
  if (url === undefined) history.pushState({pot: name}, "");
  else history.pushState({pot: name}, "", url);
}
function navReplace(name, url) {
  if (url === undefined) history.replaceState({pot: name}, "");
  else history.replaceState({pot: name}, "", url);
}
function goBack(fallback) {
  if (navDepth > 0) {
    navDepth--;
    history.back();
  } else {
    fallback();
  }
}
function applyNavState(name) {
  if (name !== "language" && name !== "choice" && name !== "houses") return;
  if (RUN) {
    if (status && status.finished_at) {
      newTurnover();
      return;
    }
    if (!confirm(T().exitConfirm)) {
      navPush("run");
      return;
    }
    RUN = "";

    resetRunState();
    const url = new URL(location.href);
    url.searchParams.delete("run");
    navReplace("houses", url);
    renderMaybe();

  if (name === "language") {
    langPicked = false;
  } else if (name === "choice") {
    langPicked = true;
    modePicked = "";
  } else {
    langPicked = true;
    modePicked = "turnover";

function screenOf() {
  if (!RUN) return "start";
  if (!tour || !status) return "loading";

}

function voiceKey() {
  if (!("speechSynthesis" in window)) return "none";

function finalCounts() {
  let proven = 0, fixed = 0, cantFix = 0, fine = 0;
  for (const room of status.rooms) for (const item of room.items) {
    if (!item.critical) continue;
    if (item.status === "proven") proven++;
    if (item.has_before) fixed++;
    if (item.resolution) {
      if (item.resolution.action === "cant_fix") cantFix++;
      else fine++;
    }
  }
  return {proven: proven, fixed: fixed, cantFix: cantFix, fine: fine};
}

function renderKey() {
  const screen = screenOf();
  const base = [LANG, langPicked, modePicked, screen];
  if (screen === "start") return JSON.stringify(base.concat([(LANGS || []).length]));
  if (screen === "loading") return JSON.stringify(base.concat([!!tour, !!status]));
  if (screen === "final") {
    const c = finalCounts();
    return JSON.stringify(base.concat([c.proven, c.fixed, c.cantFix, c.fine]));
  }
  // Only what the screen shows: polling every 0.5 s must not rebuild it
  // for news, photo_seconds or checking-list churn underneath.
  if (screen === "round") {
    const shot = roundCurrent();
    const p = status.progress;
    const last = lastTakenShot();
    return JSON.stringify(base.concat([
      shot ? shot.shot_id : null,
      p.shots_taken, p.shots_total, p.rooms_done, p.rooms_total,
      Array.from(optimistic, ([k, v]) => [k, v.state]),
      last ? last.shot_id : null,
      photoError, !!recorder, transcribing, noteMsg,
      selectedDemo, (demoPhotos || []).length,
      voiceKey(),
      (status.unchecked || []).length,
      (status.skipped_shots || []).join(","),
      camMode, camWaiting,
    ]));
  }
  const byId = itemsById();
  const shown = shownCard();
  const item = shown ? byId[shown] : null;
  const total = status.progress.photos, left = status.checking.length;
  return JSON.stringify(base.concat([
    shown,
    item ? cardText(item) : null,
    item ? cardPhotoUrl(item) : null,
    cardPanel, cardNoteId, cardNoteText,
    cardOrder.length, cardsTotal,
    total - left, total,
    toast,
    !shown && !left,
    photoError, !!recorder, transcribing, noteMsg,
    selectedDemo, (demoPhotos || []).length,
    (status.unchecked || []).join(","),
    retrying,
  ]));
}

function pickMime() {
  const cands = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
  if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
    for (const c of cands) {
      try {
        if (MediaRecorder.isTypeSupported(c)) return c;
      } catch (e) {}
    }
  }
  return "";
}

function tickRec() {
  recSeconds = Math.floor((Date.now() - recStart) / 1000);
  for (const id of ["micStop", "cardMicStop"]) {
    const b = document.getElementById(id);
    if (!b) continue;
    const t = b.querySelector(".t");
    if (t) t.textContent = fmtTime(recSeconds);
    else b.textContent = `${T().stop} (${fmtTime(recSeconds)})`;
  }
  if (recSeconds >= 60) stopRec();
}

async function startRec(roomId, itemId, onDone) {
  noteMsg = "";
  recRoom = roomId;
  recItem = itemId || null;
  recOnDone = onDone || null;
  try {
    recStream = await navigator.mediaDevices.getUserMedia({audio: true});
  } catch (e) {
    noteMsg = T().micDenied;
    scheduleNoteClear();
    renderMaybe();
    return;
  }
  const mime = pickMime();
  try {
    recorder = mime ? new MediaRecorder(recStream, {mimeType: mime})
      : new MediaRecorder(recStream);
  } catch (e) {
    recStream.getTracks().forEach(t => t.stop());
    recStream = null;
    noteMsg = T().micDenied;
    scheduleNoteClear();
    renderMaybe();
    return;
  }
  recChunks = [];
  recorder.ondataavailable = ev => { if (ev.data && ev.data.size) recChunks.push(ev.data); };
  recorder.onstop = sendRec;
  recStart = Date.now();
  recSeconds = 0;
  recorder.start();
  if (recTimer) clearInterval(recTimer);
  recTimer = setInterval(tickRec, 250);
  lastKey = null;
  renderMaybe();
}

function stopRec() {
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  if (recorder && recorder.state !== "inactive") recorder.stop();
}

function scheduleNoteClear() {
  if (noteMsgTimer) clearTimeout(noteMsgTimer);
  noteMsgTimer = setTimeout(() => {
    noteMsgTimer = null;
    noteMsg = "";
    renderMaybe();
  }, 8000);
}

async function sendRec() {
  const chunks = recChunks;
  const mime = (recorder && recorder.mimeType) || "";
  if (recStream) {
    recStream.getTracks().forEach(t => t.stop());
    recStream = null;
  }
  recorder = null;
  recChunks = [];
  transcribing = true;
  lastKey = null;
  renderMaybe();
  const ext = mime.indexOf("mp4") >= 0 ? "mp4" : "webm";
  const form = new FormData();
  form.append("room_id", recRoom);
  if (recItem) form.append("item_id", recItem);
  form.append("audio", new Blob(chunks, {type: mime || "audio/webm"}), `note.${ext}`);
  try {
    const res = await api(`/api/runs/${encodeURIComponent(RUN)}/notes`,
      {method: "POST", body: form});
    transcribing = false;
    if (res.status === "no_speech") {
      noteMsg = T().noSpeech;
      scheduleNoteClear();
    } else if (recOnDone) {
      noteMsg = "";
      recOnDone(res.note);
    } else {
      noteMsg = "";
      await refresh();
    }
    renderMaybe();
  } catch (e) {
    transcribing = false;
    noteMsg = e.message;
    scheduleNoteClear();
    renderMaybe();
  }
}

function snapShot(shot, file, quiet) {
  const url = URL.createObjectURL(file);
  optimistic.set(shot.shot_id, {file: file, url: url, state: "sending"});
  if (overrideShot === shot.shot_id) overrideShot = null;
  if (!quiet) {
    const next = roundCurrent();
    if (next && next.shot_id !== shot.shot_id) {
      prevShotId = next.shot_id;
      say(roomHeading(next) + ". " + instruction(next));
    }
  }
  renderMaybe();
  sendShot(shot.shot_id, file);
}

async function sendShot(shotId, file) {
  const form = new FormData();
  form.append("shot_id", shotId);
  form.append("image", file);
  try {
    await apiUpload(`/api/runs/${encodeURIComponent(RUN)}/photos`, {method: "POST", body: form});
    const entry = optimistic.get(shotId);
    if (entry) {
      try { URL.revokeObjectURL(entry.url); } catch (e) {}
      optimistic.delete(shotId);
    }
    photoError = "";
    await refresh();
  } catch (e) {
    if (e.message.indexOf("foto antigua") >= 0) {
      const entry = optimistic.get(shotId);
      if (entry) {
        try { URL.revokeObjectURL(entry.url); } catch (err) {}
        optimistic.delete(shotId);
      }
      photoError = T().oldPhoto;
    } else {
      const entry = optimistic.get(shotId);
      if (entry) {
        entry.state = "failed";
      } else {
        optimistic.set(shotId, {
          file: file, url: URL.createObjectURL(file), state: "failed",
        });
      }
    }
  }
  renderMaybe();
}

async function sheetSnap(itemId) {
  if (camMode === "live" && camLive()) {
    const video = document.getElementById("camView");
    if (!video.videoWidth) {
      const waitEl = document.getElementById("sheetWait");
      if (waitEl) waitEl.hidden = false;
      const ready = await waitForVideo(video, 1500);
      if (!camSheet) return;
      if (waitEl) waitEl.hidden = true;
      if (!ready || !camLive()) {
        closeSheet();
        pendingCard = itemId;
        pendingShot = null;
        document.getElementById("snapFile").click();
        return;
      }
    }
    const file = await captureFrame("camView");
    if (file) {
      flash();
      closeSheet();
      cardSnap(itemId, file);
      return;
    }
  }
  closeSheet();
  pendingCard = itemId;
  pendingShot = null;
  document.getElementById("snapFile").click();
}

function cardSnap(itemId, file) {
  const shot = shotForCard(itemId);
  if (!shot) return;
  const btn = document.getElementById("cardFixed");
  if (btn) btn.disabled = true;
  const remove = () => {
    retakePhotos[itemId] = null;
    const i = cardOrder.indexOf(itemId);
    if (i >= 0) cardOrder.splice(i, 1);
    cardPanel = null;
    renderMaybe();
  };
  const card = document.querySelector("#app .stack .card");
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (card && !calm) {
    card.classList.add("out");
    setTimeout(remove, 220);
  } else {
    remove();
  }
  (async () => {
    const form = new FormData();
    form.append("shot_id", shot.shot_id);
    form.append("image", file);
    try {
      const res = await apiUpload(`/api/runs/${encodeURIComponent(RUN)}/photos`,
        {method: "POST", body: form});
      retakePhotos[itemId] = res.photo_id;
      photoError = "";
      await refresh();
    } catch (e) {
      delete retakePhotos[itemId];
      if (cardOrder.indexOf(itemId) < 0) cardOrder.unshift(itemId);
      photoError = e.name === "AbortError" ? T().notSent
        : e.message.indexOf("foto antigua") >= 0 ? T().oldPhoto : e.message;
    }
    renderMaybe();
  })();
}

async function resolveCard(itemId, action, reason) {
  try {
    await api(`/api/runs/${encodeURIComponent(RUN)}/items/${encodeURIComponent(itemId)}/resolve`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action: action, reason: reason, note_id: cardNoteId}),
    });
    cardPanel = null;
    cardNoteId = null;
    cardNoteText = "";
    photoError = "";
    await refresh();
  } catch (e) {
    photoError = e.message;
  }
  renderMaybe();
}

async function finishRun() {
  try {
    await api(`/api/runs/${encodeURIComponent(RUN)}/finish`, {method: "POST"});
    photoError = "";
    await refresh();
    if (status.finished_at) navReplace("final");
  } catch (e) {
    photoError = e.message;
  }
  renderMaybe();
}

async function endRound() {
  try {
    await api(`/api/runs/${encodeURIComponent(RUN)}/end-round`, {method: "POST"});
    photoError = "";
    await refresh();
  } catch (e) {
    photoError = e.message;
  }
  renderMaybe();
}

async function skipShot(shotId) {
  try {
    await api(`/api/runs/${encodeURIComponent(RUN)}/skip-shot`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({shot_id: shotId}),
    });
    photoError = "";
    await refresh();
  } catch (e) {
    photoError = e.message;
  }
  lastKey = null;
  renderMaybe();
}

async function retryUnchecked() {
  retrying = true;
  renderMaybe();
  try {
    await api(`/api/runs/${encodeURIComponent(RUN)}/recheck-unchecked`, {method: "POST"});
    photoError = "";
    await refresh();
  } catch (e) {
    photoError = e.message;
  }
  retrying = false;
  renderMaybe();
}

function showToast(text) {
  toast = text;
  chime();
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastTimer = null;
    toast = null;
    renderMaybe();
  }, 3500);
  renderMaybe();
}

function reconcileCards() {
  const server = status.cards || [];
  for (const id of Object.keys(retakePhotos)) {
    const pid = retakePhotos[id];
    const done = !!pid && (status.checking || []).indexOf(pid) < 0;
    if (!done) continue;
    delete retakePhotos[id];
    if (server.indexOf(id) < 0) {
      showToast(T().fixedToast);
    } else if (cardOrder.indexOf(id) < 0) {
      cardOrder.push(id);
    }
  }
  for (let i = cardOrder.length - 1; i >= 0; i--) {
    if (server.indexOf(cardOrder[i]) < 0) cardOrder.splice(i, 1);
  }
  for (const id of server) {
    if (cardOrder.indexOf(id) < 0) cardOrder.push(id);
  }
}

function announce() {
  if (!status || !tour) return;
  if (!allTaken() && !status.round_ended) {
    const cur = roundCurrent();
    const curId = cur ? cur.shot_id : null;
    if (prevShotId !== null && curId && curId !== prevShotId) {
      say(roomHeading(cur) + ". " + instruction(cur));
    }
    if (curId) prevShotId = curId;
    return;
  }
  if (!photosDoneSaid) {
    photosDoneSaid = true;
    say(T().photosDone);
  }
  const byId = itemsById();
  const shown = shownCard();
  if (shown && shown !== spokenCard && byId[shown]) {
    spokenCard = shown;
    say(cardText(byId[shown]));
  }
  if (status.finished_at && !saidFinal) {
    saidFinal = true;
    say(T().doneAll);
  }
}

async function refresh() {
  if (!tour || tourRun !== RUN) {
    const t = await api(`/api/runs/${encodeURIComponent(RUN)}/tour`);
    tour = {shots: t.shots};
    tourRun = RUN;
  }
  const s = await api(`/api/runs/${encodeURIComponent(RUN)}/status`);
  status = s;
  takenSet = new Set((s.recent || []).map(e => e.shot_id));
  reconcileCards();
  if (s.language && I18N[s.language]) {
    if (LANG !== s.language) { LANG = s.language; pickVoice(); }
    langPicked = true;
  }
  if (DEMO && demoPhotos === null) {
    try { demoPhotos = (await api("/api/demo-photos")).photos; }
    catch (e) { demoPhotos = []; }
  }
  announce();
}

function startPoll() {
  if (pollTimer) return;
  const tick = async () => {
    pollTimer = null;
    try { await refresh(); renderMaybe(); } catch (e) {}
    if (!RUN) return;
    let busy = false;
    for (const entry of optimistic.values()) {
      if (entry.state !== "failed") { busy = true; break; }
    }
    if (!busy && status && status.checking && status.checking.length) busy = true;
    pollTimer = setTimeout(tick, busy ? 500 : 2000);
  };
  pollTimer = setTimeout(tick, 2000);
}

async function boot() {
  document.getElementById("snapFile").onchange = ev => {
    const input = ev.target;
    const file = input.files.length ? input.files[0] : null;
    input.value = "";
    if (!file || !tour) {
      pendingShot = null;
      pendingCard = null;
      return;
    }
    if (pendingCard) {
      const id = pendingCard;
      pendingCard = null;
      cardSnap(id, file);
    } else if (pendingShot) {
      const shot = tour.shots.find(x => x.shot_id === pendingShot);
      pendingShot = null;
      if (shot) snapShot(shot, file);
    }
  };
  document.getElementById("overlay").onclick = () => {
    document.getElementById("overlay").style.display = "none";
  };
  document.addEventListener("visibilitychange", async () => {
    if (document.hidden) {
      stopCamera();
      return;
    }
    if (RUN) {
      if (!status || !status.finished_at) lockScreen();
      try { await refresh(); renderMaybe(); } catch (e) {}
      if (camSheet || screenOf() === "round") attachCamera();
    }
  });
  window.addEventListener("popstate", ev => {
    navDepth = Math.max(0, navDepth - 1);
    applyNavState(ev.state && ev.state.pot);
  });
  const saved = loadSavedLang();
  if (saved && I18N[saved]) {
    LANG = saved;
    langPicked = true;
    pickVoice();
  }
  const app = document.getElementById("app");
  try {
    if (RUN) {
      resetRunState();
      await refresh();
      startPoll();
      if (status.finished_at) navReplace("final");
      else {
        navReplace("run");
        lockScreen();
      }
    } else if (!langPicked) {
      navReplace("language");
    } else {
      navReplace("choice");
    }
    renderMaybe();
  } catch (e) { fail(app, e); }
}
boot();
</script>
