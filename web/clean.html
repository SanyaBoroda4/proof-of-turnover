<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turno de limpieza</title>
<style>
  :root { --green: #1a7f37; --red: #b42318; --orange: #b54708; --grey: #57606a; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0;
         padding: 16px; max-width: 640px; margin-left: auto; margin-right: auto;
         background: #fff; color: #1f2328; font-size: 18px; }
  h1 { font-size: 24px; margin: 8px 0 16px; }
  h2.room { font-size: 20px; margin: 16px 0 4px; color: var(--grey); font-weight: 600; }
  .bar { height: 10px; background: #e5e5e5; border-radius: 5px; overflow: hidden; margin: 8px 0; }
  .bar > div { height: 100%; background: var(--green); }
  .progress { color: var(--grey); font-size: 15px; }
  .instruction { font-size: 26px; line-height: 1.35; margin: 4px 0 20px; font-weight: 600; }
  .btn { display: block; width: 100%; padding: 16px; margin: 10px 0; font-size: 20px;
         border: none; border-radius: 10px; background: var(--green); color: #fff;
         cursor: pointer; text-align: center; }
  .btn.secondary { background: #e5e5e5; color: #1f2328; }
  .btn:disabled { opacity: 0.5; }
  .camera { display: block; width: 100%; padding: 20px; margin: 10px 0; font-size: 22px;
         border: none; border-radius: 10px; background: #0969da; color: #fff;
         cursor: pointer; text-align: center; }
  .result { border-radius: 10px; padding: 14px 16px; margin: 12px 0; font-size: 19px; }
  .result.ok { background: #dafbe1; }
  .result.bad { background: #ffebe9; }
  .result.wait { background: #fff8c5; }
  .result button { font-size: 16px; padding: 8px 14px; margin-top: 6px; }
  .pending { border-top: 1px solid #ddd; margin-top: 24px; padding-top: 8px; }
  .pending li { margin: 12px 0; }
  .pending button, .open button { font-size: 16px; padding: 8px 14px; margin-left: 8px; }
  .open li { margin: 12px 0; }
  select, input[type=text] { font-size: 18px; padding: 10px; width: 100%; margin: 6px 0; }
  .error { background: #ffebe9; border-radius: 10px; padding: 14px; margin: 12px 0; }
  .small { font-size: 15px; color: var(--grey); }
</style>
</head>
<body>
<div id="app"><p>Cargando…</p></div>
<input type="file" id="snapFile" accept="image/*" capture="environment" hidden>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const CODE = params.get("code") || "";
const DEMO = params.get("demo") === "1";
const OLD_PHOTO_ES = "Foto antigua: esta foto es de antes de empezar. Toma una nueva.";
let RUN = params.get("run") || "";
let tour = null, takenSet = new Set(), status = null, demoPhotos = null;
let overrideShot = null, selectedDemo = "", photoError = "", lastKey = null;
let pollTimer = null, pendingShot = null;
let prevShotId = null, seenReqIds = null;

async function api(path, opts) {
  const r = await fetch(path, opts || {});
  if (r.status === 401) throw new Error("auth");
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return r.json();
}

let voice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(
    v => v.lang && v.lang.toLowerCase().startsWith("es"));
  voice = vs.find(v => v.lang.toLowerCase() === "es-us")
    || vs.find(v => v.lang.toLowerCase() === "es-mx")
    || vs[0] || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
const speechQueue = [];
let speaking = false;
let speechTimer = null;
function pumpSpeech() {
  if (speaking || !speechQueue.length || !("speechSynthesis" in window)) return;
  speaking = true;
  const u = new SpeechSynthesisUtterance(speechQueue.shift());
  if (voice) u.voice = voice;
  u.lang = (voice && voice.lang) || "es";
  u.onend = u.onerror = () => {
    speaking = false;
    if (speechTimer) { clearTimeout(speechTimer); speechTimer = null; }
    pumpSpeech();
  };
  if (speechTimer) clearTimeout(speechTimer);
  speechTimer = setTimeout(() => {
    // Some Android Chrome versions never fire onend: force-advance.
    speechTimer = null;
    if (speaking) {
      speaking = false;
      try { speechSynthesis.cancel(); } catch (e) {}
      pumpSpeech();
    }
  }, 15000);
  speechSynthesis.speak(u);
}
function say(text) { speechQueue.push(text); pumpSpeech(); }
function repeatSay(text) {
  speechQueue.length = 0;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  speaking = false;
  say(text);
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function roomName(roomId) {
  for (const room of status.rooms) {
    if (room.id === roomId) return room.name;
  }
  return roomId;
}

function roomHeading(shot) {
  return shot.room_name_es || roomName(shot.room_id);
}

function shotOfItem(itemId) {
  for (const s of tour.shots) {
    if ((s.item_ids || []).indexOf(itemId) >= 0) return s;
  }
  return null;
}

function itemsById() {
  const map = {};
  for (const room of status.rooms) for (const item of room.items) map[item.id] = item;
  return map;
}

function currentShot() {
  if (overrideShot) {
    const s = tour.shots.find(x => x.shot_id === overrideShot);
    if (s) return s;
    overrideShot = null;
  }
  return status.current_shot;
}

function renderMaybe() {
  const key = JSON.stringify([tour, status, overrideShot, selectedDemo, photoError]);
  if (key === lastKey) return;
  lastKey = key;
  render();
}

function render() {
  const app = document.getElementById("app");
  if (!RUN) return renderStart(app);
  if (!tour || !status) { app.innerHTML = "<p>Cargando…</p>"; return; }
  if (!status.current_shot && !status.checking.length && !overrideShot) {
    return renderDone(app);
  }
  return renderShot(app);
}

async function renderStart(app) {
  let props = [];
  try { props = (await api("/api/properties")).properties; } catch (e) { return fail(app, e); }
  const options = props.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  app.innerHTML = `<h1>Turno de limpieza</h1>
    <label class="small" for="prop">Casa</label>
    <select id="prop">${options}</select>
    <button class="btn" id="start">Empezar</button>
    ${DEMO ? '<p class="small">Modo demo: las fotos salen de una carpeta.</p>' : ""}`;
  document.getElementById("start").onclick = startTour;
}

async function startTour() {
  say("Empezamos");
  const app = document.getElementById("app");
  const property = document.getElementById("prop").value;
  app.innerHTML = "<p>Empezando…</p>";
  try {
    const created = await api("/api/runs", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({property: property, demo: DEMO}),
    });
    RUN = created.run_id;
    const url = new URL(location.href);
    url.searchParams.set("run", RUN);
    history.replaceState(null, "", url);
    await refresh();
    startPoll();
    const shot = currentShot();
    if (shot) {
      prevShotId = shot.shot_id;
      say(roomHeading(shot) + ". " + shot.instruction_es);
    }
    renderMaybe();
  } catch (e) { fail(app, e); }
}

function progressHtml() {
  const p = status.progress;
  const pct = p.shots_total ? Math.round(100 * p.shots_taken / p.shots_total) : 0;
  return `<div class="progress">Habitación ${Math.min(p.rooms_done + 1, p.rooms_total)} de ${p.rooms_total} · Foto ${p.shots_taken} de ${p.shots_total}</div>
    <div class="bar"><div style="width:${pct}%"></div></div>`;
}

function shotState(shot) {
  const byId = itemsById();
  const items = (shot.item_ids || []).map(id => byId[id]).filter(Boolean);
  const critical = items.filter(i => i.critical);
  if (critical.length && critical.every(i => i.status === "proven")) return "done";
  if (critical.some(i => i.request)) return "failed";
  return "wait";
}

function shortName(shot) {
  const s = shot.short_es || roomHeading(shot);
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function cameraHtml(label) {
  if (DEMO) {
    const options = (demoPhotos || []).map(p => {
      const sel = p.url === selectedDemo ? " selected" : "";
      return `<option value="${esc(p.url)}"${sel}>${esc(p.name)}</option>`;
    }).join("");
    return `<label class="small" for="demoPick">Foto demo</label>
      <select id="demoPick">${options}</select>
      <button class="btn" id="snapDemo">${esc(label)}</button>`;
  }
  return `<button class="camera" id="snapCam">${esc(label)}</button>`;
}

function recentHtml(current) {
  const ids = [];
  if (current && takenSet.has(current.shot_id)) ids.push(current.shot_id);
  for (const entry of (status.recent || [])) {
    if (ids.indexOf(entry.shot_id) < 0) ids.push(entry.shot_id);
  }
  const list = ids.slice(0, 5);
  if (!list.length) return "";
  const byId = itemsById();
  const shotById = {};
  tour.shots.forEach(s => { shotById[s.shot_id] = s; });
  const rows = list.map(shotId => {
    const shot = shotById[shotId];
    if (!shot) return "";
    const room = esc(roomHeading(shot));
    const short = esc(shortName(shot));
    const items = (shot.item_ids || []).map(id => byId[id]).filter(Boolean);
    const critical = items.filter(i => i.critical);
    if (critical.length && critical.every(i => i.status === "proven")) {
      return `<div class="result ok">✓ ${room}: ${short}</div>`;
    }
    const failed = critical.filter(i => i.request);
    if (failed.length) {
      return `<div class="result bad">${failed.map(i => `<p>${esc(i.request.cleaner)}</p>`).join("")}<button data-retake="${esc(shot.shot_id)}">Repetir foto</button></div>`;
    }
    return `<div class="result wait">${room}: Revisando…</div>`;
  }).join("");
  return rows ? `<div>${rows}</div>` : "";
}

function renderShot(app) {
  const shot = currentShot();
  let html = `<h1>Turno de limpieza</h1>` + progressHtml();
  if (status.checking.length) html += `<div class="result wait">Revisando la foto… puedes seguir.</div>`;
  if (shot) {
    html += `<h2 class="room">${esc(roomHeading(shot))}</h2>
      <div class="instruction">${esc(shot.instruction_es)}</div>
      <button class="btn secondary" id="repeat">Repetir</button>`;
    if (!takenSet.has(shot.shot_id)) {
      html += cameraHtml("Fotografiar");
    } else if (shotState(shot) === "done") {
      html += `<div class="result ok">✓ Listo</div>
        <button class="btn" id="next">Siguiente</button>`;
    } else if (status.checking.length) {
      html += `<div class="result wait">Revisando la foto…</div>`;
    }
    html += recentHtml(shot);
  }
  if (photoError) html += `<div class="error">${esc(photoError)}</div>`;
  app.innerHTML = html;
  if (shot) {
    document.getElementById("repeat").onclick = () =>
      repeatSay(roomHeading(shot) + ". " + shot.instruction_es);
    const next = document.getElementById("next");
    if (next) next.onclick = () => { overrideShot = null; renderMaybe(); };
    wireCamera(shot);
  }
  app.querySelectorAll("[data-retake]").forEach(b => {
    b.onclick = () => {
      overrideShot = b.getAttribute("data-retake");
      renderMaybe();
    };
  });
}

function wireCamera(shot) {
  const pick = document.getElementById("demoPick");
  if (pick) {
    if (!selectedDemo && demoPhotos && demoPhotos.length) selectedDemo = demoPhotos[0].url;
    pick.value = selectedDemo;
    pick.onchange = () => { selectedDemo = pick.value; };
    const snap = document.getElementById("snapDemo");
    if (snap) snap.onclick = async () => {
      const blob = await (await fetch(selectedDemo)).blob();
      upload(shot, new File([blob], "demo.jpg", {type: "image/jpeg"}));
    };
    return;
  }
  const cam = document.getElementById("snapCam");
  if (cam) cam.onclick = () => openCamera(shot.shot_id);
}

function openCamera(shotId) {
  pendingShot = shotId;
  document.getElementById("snapFile").click();
}

async function upload(shot, file) {
  const form = new FormData();
  form.append("shot_id", shot.shot_id);
  form.append("image", file);
  try {
    await api(`/api/runs/${encodeURIComponent(RUN)}/photos`, {method: "POST", body: form});
    photoError = "";
    overrideShot = null;
    await refresh();
    renderMaybe();
  } catch (e) {
    photoError = e.message.indexOf("foto antigua") >= 0 ? OLD_PHOTO_ES : e.message;
    renderMaybe();
  }
}

function renderDone(app) {
  const byId = itemsById();
  let html = `<h1>Turno terminado</h1>` + progressHtml();
  if (!status.open.length) {
    html += `<div class="result ok">✓ Todo listo</div>`;
  } else {
    const head = status.open.length === 1 ? "Queda 1 tema" : `Quedan ${status.open.length} temas`;
    html += `<p>${head}:</p><ul class="open">` + status.open.map(id => {
      const item = byId[id];
      const text = item.request ? item.request.cleaner : item.label;
      const s = shotOfItem(id);
      const btn = s ? ` <button data-shot="${esc(s.shot_id)}">Fotografiar</button>` : "";
      return `<li>${esc(text)}${btn}</li>`;
    }).join("") + `</ul>`;
  }
  app.innerHTML = html;
  app.querySelectorAll("[data-shot]").forEach(b => {
    b.onclick = () => { overrideShot = b.getAttribute("data-shot"); renderMaybe(); };
  });
}

function fail(app, e) {
  if (e.message === "auth") {
    app.innerHTML = `<div class="error">Este enlace no tiene código. Pide el enlace completo.</div>`;
  } else {
    app.innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}

function announce() {
  const cur = currentShot();
  const curId = cur ? cur.shot_id : null;
  if (prevShotId !== null && curId && curId !== prevShotId) {
    say(roomHeading(cur) + ". " + cur.instruction_es);
  }
  if (curId) prevShotId = curId;
  const byId = itemsById();
  const current = new Set();
  for (const id of status.open) {
    const item = byId[id];
    if (item && item.request) {
      current.add(id);
      if (seenReqIds && !seenReqIds.has(id)) say(item.request.cleaner);
    }
  }
  seenReqIds = current;
}

async function refresh() {
  const [t, s] = await Promise.all([
    api(`/api/runs/${encodeURIComponent(RUN)}/tour`),
    api(`/api/runs/${encodeURIComponent(RUN)}/status`),
  ]);
  tour = {shots: t.shots};
  takenSet = new Set(t.taken);
  status = s;
  if (DEMO && demoPhotos === null) {
    try { demoPhotos = (await api("/api/demo-photos")).photos; }
    catch (e) { demoPhotos = []; }
  }
  announce();
}

function startPoll() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    try { await refresh(); renderMaybe(); } catch (e) {}
  }, 2000);
}

async function boot() {
  document.getElementById("snapFile").onchange = ev => {
    const input = ev.target;
    if (input.files.length && pendingShot) {
      const shot = tour.shots.find(x => x.shot_id === pendingShot);
      const file = input.files[0];
      input.value = "";
      if (shot) upload(shot, file);
    } else {
      input.value = "";
    }
  };
  document.addEventListener("visibilitychange", async () => {
    if (!document.hidden && RUN) {
      try { await refresh(); renderMaybe(); } catch (e) {}
    }
  });
  const app = document.getElementById("app");
  try {
    if (RUN) {
      await refresh();
      startPoll();
    }
    renderMaybe();
  } catch (e) { fail(app, e); }
}
boot();
</script>
</body>
</html>
