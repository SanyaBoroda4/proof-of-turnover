function panelHtml(itemId) {
  if (!cardPanel || cardPanel.item !== itemId) return "";
  let html = "";
  if (cardNoteId) {
    html += `<div class="result ok">✓ ${esc(cardNoteText)}</div>`;
  }
  if (!recorder && !transcribing && !cardNoteId) {
    if (micReady()) {
      html += `<button class="btn secondary" id="cardMic">${esc(T().mic)}</button>`;
    } else {
      html += `<p class="small">${esc(T().insecure)}</p>`;
    }
  }
  if (recorder) {
    html += `<button class="btn secondary" id="cardMicStop">${esc(T().stop)} (${esc(fmtTime(recSeconds))})</button>`;
  }
  if (transcribing) {
    html += `<div class="result wait">${esc(T().transcribing)}</div>`;
  }
  if (noteMsg) html += `<div class="result wait">${esc(noteMsg)}</div>`;
  if (cardPanel.action === "cant_fix") {
    html += `<div class="chips">` + T().reasons.map((label, i) =>
      `<button class="chip" data-reason="${esc(REASONS[i])}">${esc(label)}</button>`
    ).join("") + `</div>`;
  } else if (cardPanel.action === "its_fine") {
    html += `<button class="btn" id="cardConfirm">${esc(T().confirm)}</button>`;
  } else if (cardPanel.action === "retake") {
    html += cameraHtml(T().fixed, "demoPickCard", "snapDemoCard");
  }
  return html;
}

function cardHtml(item, animate, pos, total) {
  const missing = !item.has_evidence && !item.photo_id;
  const url = cardPhotoUrl(item);
  const ex = exampleUrl(shotOfItem(item.id));
  let img = "";
  if (url) {
    img = `<div class="photowrap"><img class="photo" src="${url}" data-full="${url}" alt=""></div>`
      + (ex ? `<button class="exrow" data-full="${esc(ex)}" data-cap="${esc(T().howShould)}"><img src="${esc(ex)}" alt=""><span>${esc(T().shouldLook)}</span></button>` : "");
  } else if (ex) {
    img = `<div class="photowrap"><img class="photo" src="${esc(ex)}" data-full="${esc(ex)}" data-cap="${esc(T().shouldLook)}" alt=""></div>`;
  }
  const notVisible = item.status === "needs photo";
  const fixed = shotForCard(item.id)
    ? `<button class="btn" id="cardFixed">${ICONS.camera}${esc(T().fixed)}</button>` : "";
  return `<div class="card${animate ? " slide" : ""}">
    <div class="tagrow"><span class="tag ${notVisible || missing ? "missing" : "fix"}">${esc(notVisible ? T().notVisible : missing ? T().missingTag : T().fixTag)}</span><span class="of">${esc(T().ofTotal(pos, total))}</span></div>
    <div class="instruction">${esc(cardText(item))}</div>
    <div class="small">${esc(T().newPhotoHint)}</div>
    ${img}
    <div class="cardactions">
      ${fixed}
      <div class="btnrow">
        <button class="btn secondary" id="cardCant">${esc(T().cantFix)}</button>
        <button class="btn secondary" id="cardFine">${esc(T().itsFine)}</button>
      </div>
    </div>
    <button class="link" id="cardLater">${esc(T().later)}</button>
  </div>`;
}

function groupCardHtml(group, animate, pos, total) {
  const byId = itemsById();
  const items = group.item_ids.map(id => byId[id]).filter(Boolean);
  if (!items.length) return "";
  if (items.length === 1) return cardHtml(items[0], animate, pos, total);
  const anyProblem = items.some(i => i.status === "problem");
  const groupShot = group.shot_id
    ? tour.shots.find(s => s.shot_id === group.shot_id) : null;
  const ex = groupShot ? exampleUrl(groupShot) : exampleUrl(shotOfItem(items[0].id));
  let img = "";
  if (group.photo_id) {
    const ids = group.item_ids.map(encodeURIComponent).join(",");
    const url = `/api/runs/${encodeURIComponent(RUN)}/photos/${encodeURIComponent(group.photo_id)}/card?items=${ids}&v=${encodeURIComponent(group.photo_id)}`;
    img = `<div class="photowrap"><img class="photo" src="${url}" data-full="${url}" alt=""></div>`
      + (ex ? `<button class="exrow" data-full="${esc(ex)}" data-cap="${esc(T().howShould)}"><img src="${esc(ex)}" alt=""><span>${esc(T().shouldLook)}</span></button>` : "");
  } else if (ex) {
    img = `<div class="photowrap"><img class="photo" src="${esc(ex)}" data-full="${esc(ex)}" data-cap="${esc(T().shouldLook)}" alt=""></div>`;
  }
  const lines = items.map(i =>
    `<div class="instruction">${esc(cardText(i))}</div>`
    + (i.status === "needs photo"
      ? `<div><span class="tag missing">${esc(T().notVisible)}</span></div>` : "")
  ).join("");
  const first = items[0];
  const fixed = shotForCard(first.id)
    ? `<button class="btn" id="cardFixed">${ICONS.camera}${esc(T().fixed)}</button>` : "";
  return `<div class="card${animate ? " slide" : ""}">
    <div class="tagrow"><span class="tag ${anyProblem ? "fix" : "missing"}">${esc(anyProblem ? T().fixTag : T().notVisible)}</span><span class="of">${esc(T().ofTotal(pos, total))}</span></div>
    ${lines}
    <div class="small">${esc(T().newPhotoHint)}</div>
    ${img}
    <div class="cardactions">
      ${fixed}
      <div class="btnrow">
        <button class="btn secondary" id="cardCant">${esc(T().cantFix)}</button>
        <button class="btn secondary" id="cardFine">${esc(T().itsFine)}</button>
      </div>
    </div>
    <button class="link" id="cardLater">${esc(T().later)}</button>
  </div>`;
}

function renderCards(app) {
  const byId = itemsById();
  const remaining = groupsRemaining();
  if (remaining > cardsTotal) cardsTotal = remaining;
  const pos = Math.max(1, cardsTotal - remaining + 1);
  let html = `<div class="wrap"><div class="cardshead"><h1>${esc(T().photosDone)}</h1>`
    + (remaining ? `<div class="left">${esc(T().toFix(remaining))}</div>` : "")
    + `</div>` + uncheckedLineHtml();
  const skippedCount = (status.skipped_shots || []).length;
  if (skippedCount) {
    html += `<div class="small centerline">${esc(T().skippedLine(takenSet.size, skippedCount))}</div>`;
  }
  const total = status.progress.photos;
  const left = status.checking.length;
  if (left) {
    html += `<div class="result wait">${esc(T().checkingPhotos(total - left, total))}</div>`;
  }
  const blind = uncheckedCount();
  if (blind) {
    html += `<div class="card">
      <div class="instruction">${esc(T().uncheckedCard(blind))}</div>
      <button class="btn" id="retryUnchecked"${retrying ? " disabled" : ""}>${esc(retrying ? T().retrying : T().retry)}</button>
    </div>`;
  }
  const shown = shownCard();
  if (shown && byId[shown]) {
    const animate = shown !== lastShownCard;
    lastShownCard = shown;
    const peek1 = remaining > 1 ? `<div class="peek p1"></div>` : "";
    const peek2 = remaining > 2 ? `<div class="peek p2"></div>` : "";
    const group = shownGroup();
    html += `<div class="stack">${peek2}${peek1}${group ? groupCardHtml(group, animate, pos, cardsTotal) : cardHtml(byId[shown], animate, pos, cardsTotal)}</div>`;
    if (cardPanel && cardPanel.action === "retake" &&
        (!cardPanel.item || cardPanel.item !== shown)) {
      cardPanel = null;
    }
    if (cardPanel && cardPanel.item === shown) {
      const anim = panelFresh ? " anim" : "";
      panelFresh = false;
      const title = cardPanel.action === "cant_fix" ? T().whyCant
        : cardPanel.action === "its_fine" ? T().sureFine : T().fixed;
      const x = (recorder || transcribing) ? "" :
        `<button class="iconbtn small" id="panelX" aria-label="${esc(T().close)}">${ICONS.x}</button>`;
      html += `<div class="pbackdrop${anim}" id="panelBackdrop"></div>`
        + `<div class="psheet${anim}" role="dialog" aria-modal="true">`
        + `<div class="psheethead"><h2>${esc(title)}</h2>${x}</div>`
        + `${panelHtml(shown)}</div>`;
    }
  } else {
    lastShownCard = null;
    const checkingEntry = Object.entries(retakePhotos).find(
      ([id, pid]) => pid && (status.checking || []).indexOf(pid) >= 0);
    if (checkingEntry) {
      const pid = checkingEntry[1];
      const thumb = `/api/runs/${encodeURIComponent(RUN)}/photos/${encodeURIComponent(pid)}/overview`;
      html += `<div class="card checkingcard"><div class="instruction">${esc(T().checkingRetake)}</div>`
        + `<img class="photo" src="${thumb}" alt=""><div class="spinner" aria-hidden="true"></div></div>`;
    } else if (!left) {
      html += `<button class="btn" id="finish">${esc(T().sendToHost)}</button>`;
    }
  }
  if (photoError) html += `<div class="error">${esc(photoError)}</div>`;
  if (toast) html += `<div class="toast">${esc(toast)}</div>`;
  html += `</div>`;
  app.innerHTML = html;
  if (shown && byId[shown]) wireCard(byId[shown]);
  const retryBtn = document.getElementById("retryUnchecked");
  if (retryBtn) retryBtn.onclick = retryUnchecked;
  const finish = document.getElementById("finish");
  if (finish) finish.onclick = finishRun;
  app.querySelectorAll("[data-full]").forEach(el => {
    el.onclick = () => showBig(el.getAttribute("data-full"), el.getAttribute("data-cap") || "");
  });
}

function wireCard(item) {
  const fixed = document.getElementById("cardFixed");
  if (fixed) fixed.onclick = () => startCardRetake(item.id);
  document.getElementById("cardCant").onclick = () => {
    cardPanel = {item: item.id, action: "cant_fix"};
    cardNoteId = null;
    cardNoteText = "";
    panelFresh = true;
    renderMaybe();
  };
  document.getElementById("cardFine").onclick = () => {
    cardPanel = {item: item.id, action: "its_fine"};
    cardNoteId = null;
    cardNoteText = "";
    panelFresh = true;
    renderMaybe();
  };
  document.getElementById("cardLater").onclick = () => {
    stopSpeech();
    spokenCard = null;
    const grp = shownGroup();
    const ids = grp && grp.item_ids.indexOf(item.id) >= 0
      ? grp.item_ids.slice() : [item.id];
    for (const id of ids) {
      const i = cardOrder.indexOf(id);
      if (i >= 0) cardOrder.push(cardOrder.splice(i, 1)[0]);
    }
    renderMaybe();
  };
  const mic = document.getElementById("cardMic");
  if (mic) mic.onclick = () => startRec(item.id.split(".")[0], item.id, note => {
    cardNoteId = note.id;
    cardNoteText = note.text;
    renderMaybe();
  });
  const micStop = document.getElementById("cardMicStop");
  if (micStop) micStop.onclick = stopRec;
  app_query("[data-reason]").forEach(b => {
    b.onclick = () => resolveGroup(
      groupIdsFor(item.id), "cant_fix", b.getAttribute("data-reason"));
  });
  const confirm = document.getElementById("cardConfirm");
  if (confirm) confirm.onclick = () => resolveGroup(
    groupIdsFor(item.id), "its_fine", null);
  wireDemo("demoPickCard", "snapDemoCard", file => cardSnap(item.id, file));
  const panelX = document.getElementById("panelX");
  if (panelX) panelX.onclick = closePanel;
  const backdrop = document.getElementById("panelBackdrop");
  if (backdrop) backdrop.onclick = () => {
    if (recorder || transcribing) return;
    closePanel();
  };
}

function closePanel() {
  cardPanel = null;
  cardNoteId = null;
  cardNoteText = "";
  renderMaybe();
}

function app_query(sel) {
  return document.getElementById("app").querySelectorAll(sel);
}

function renderFinal(app) {
  unlockScreen();
  const c = finalCounts();
  const sent = c.cantFix + c.fine > 0;
  app.innerHTML = `<div class="wrap">
    <div class="stampwrap"><div class="stamp">${ICONS.check}<span>${esc(sent ? T().sentStamp : T().readyStamp)}</span></div></div>
    <ul class="stats">
      <li>${esc(T().proven(c.proven))}</li>
      <li>${esc(T().fixedByYou(c.fixed))}</li>
      <li>${esc(T().cantFixCount(c.cantFix))}</li>
      <li>${esc(T().markedFineCount(c.fine))}</li>
    </ul>
    <button class="btn secondary" id="newTurnover">${esc(T().newTurnover)}</button>
    ${toast ? `<div class="toast">${esc(toast)}</div>` : ""}
  </div>`;
  document.getElementById("newTurnover").onclick = newTurnover;
}

function newTurnover() {
  RUN = "";
  modePicked = "";
  resetRunState();
  const url = new URL(location.href);
  url.searchParams.delete("run");
  navReplace("choice", url);
  renderMaybe();
}

function fail(app, e) {
  if (e.message === "auth") {
    app.innerHTML = `<div class="error">${esc(T().authError)}</div>`;
  } else {
    app.innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}

function wireDemo(pickId, snapId, onFile) {
  const pick = document.getElementById(pickId);
  if (!pick) return;
  if (!selectedDemo && demoPhotos && demoPhotos.length) selectedDemo = demoPhotos[0].url;
  pick.value = selectedDemo;
  pick.onchange = () => { selectedDemo = pick.value; };
  const snap = document.getElementById(snapId);
  if (snap) snap.onclick = async () => {
    const blob = await (await fetch(selectedDemo)).blob();
    onFile(new File([blob], "demo.jpg", {type: "image/jpeg"}));
  };
}

function openCamera(shotId) {
  pendingShot = shotId;
  pendingCard = null;
  document.getElementById("snapFile").click();
}

function pickMime() {
  const cands = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
  if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
    for (const c of cands) {
      try {
        if (MediaRecorder.isTypeSupported(c)) return c;
      } catch (e) {}
    }
  }
  return "";
}

function tickRec() {
  recSeconds = Math.floor((Date.now() - recStart) / 1000);
  for (const id of ["micStop", "cardMicStop"]) {
    const b = document.getElementById(id);
    if (!b) continue;
    const t = b.querySelector(".t");
    if (t) t.textContent = fmtTime(recSeconds);
    else b.textContent = `${T().stop} (${fmtTime(recSeconds)})`;
  }
  if (recSeconds >= 60) stopRec();
}

async function startRec(roomId, itemId, onDone) {
  noteMsg = "";
  recRoom = roomId;
  recItem = itemId || null;
  recOnDone = onDone || null;
  try {
    recStream = await navigator.mediaDevices.getUserMedia({audio: true});
  } catch (e) {
    noteMsg = T().micDenied;
    scheduleNoteClear();
    renderMaybe();
    return;
  }
  const mime = pickMime();
  try {
    recorder = mime ? new MediaRecorder(recStream, {mimeType: mime})
      : new MediaRecorder(recStream);
  } catch (e) {
    recStream.getTracks().forEach(t => t.stop());
    recStream = null;
    noteMsg = T().micDenied;
    scheduleNoteClear();
    renderMaybe();
    return;
  }
  recChunks = [];
  recorder.ondataavailable = ev => { if (ev.data && ev.data.size) recChunks.push(ev.data); };
  recorder.onstop = sendRec;
  recStart = Date.now();
  recSeconds = 0;
  recorder.start();
  if (recTimer) clearInterval(recTimer);
  recTimer = setInterval(tickRec, 250);
  lastKey = null;
  renderMaybe();
}

function stopRec() {
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  if (recorder && recorder.state !== "inactive") recorder.stop();
}

function scheduleNoteClear() {
  if (noteMsgTimer) clearTimeout(noteMsgTimer);
  noteMsgTimer = setTimeout(() => {
    noteMsgTimer = null;
    noteMsg = "";
    renderMaybe();
  }, 8000);
}

async function sendRec() {
  const chunks = recChunks;
  const mime = (recorder && recorder.mimeType) || "";
  if (recStream) {
    recStream.getTracks().forEach(t => t.stop());
    recStream = null;
  }
  recorder = null;
  recChunks = [];
  transcribing = true;
  lastKey = null;
  renderMaybe();
  const ext = mime.indexOf("mp4") >= 0 ? "mp4" : "webm";
  const form = new FormData();
  form.append("room_id", recRoom);
  if (recItem) form.append("item_id", recItem);
  form.append("audio", new Blob(chunks, {type: mime || "audio/webm"}), `note.${ext}`);
  try {
    const res = await api(`/api/runs/${encodeURIComponent(RUN)}/notes`,
      {method: "POST", body: form});
    transcribing = false;
    if (res.status === "no_speech") {
      noteMsg = T().noSpeech;
      scheduleNoteClear();
    } else if (recOnDone) {
      noteMsg = "";
      recOnDone(res.note);
    } else {
      noteMsg = "";
      await refresh();
    }
    renderMaybe();
  } catch (e) {
    transcribing = false;
    noteMsg = e.message;
    scheduleNoteClear();
    renderMaybe();
  }
}

function snapShot(shot, file, quiet) {
  const url = URL.createObjectURL(file);
  optimistic.set(shot.shot_id, {file: file, url: url, state: "sending"});
  if (overrideShot === shot.shot_id) overrideShot = null;
  if (!quiet) {
    const next = roundCurrent();
    if (next && next.shot_id !== shot.shot_id) {
      prevShotId = next.shot_id;
      sayNow(roomHeading(next) + ". " + instruction(next));
    }
  }
  renderMaybe();
  sendShot(shot.shot_id, file);
}

async function sendShot(shotId, file) {
  const form = new FormData();
  form.append("shot_id", shotId);
  form.append("image", file);
  try {
    await uploadWithRetry(`/api/runs/${encodeURIComponent(RUN)}/photos`, form);
    const entry = optimistic.get(shotId);
    if (entry) {
      try { URL.revokeObjectURL(entry.url); } catch (e) {}
      optimistic.delete(shotId);
    }
    photoError = "";
    await refresh();
  } catch (e) {
    if (e.message.indexOf("foto antigua") >= 0) {
      const entry = optimistic.get(shotId);
      if (entry) {
        try { URL.revokeObjectURL(entry.url); } catch (err) {}
        optimistic.delete(shotId);
      }
      photoError = T().oldPhoto;
    } else {
      const entry = optimistic.get(shotId);
      if (entry) {
        entry.state = "failed";
      } else {
        optimistic.set(shotId, {
          file: file, url: URL.createObjectURL(file), state: "failed",
        });
      }
    }
  }
  renderMaybe();
}

function startCardRetake(itemId) {
  if (DEMO) {
    cardPanel = {item: itemId, action: "retake"};
    panelFresh = true;
    renderMaybe();
    return;
  }
  openSheet(itemId);
}

function openSheet(itemId) {
  camSheet = {item: itemId};
  const byId = itemsById();
  const grp = groupOf(itemId);
  const text = grp && grp.item_ids.length > 1
    ? grp.item_ids.map(id => byId[id] ? cardText(byId[id]) : "").filter(Boolean).join(" ")
    : (byId[itemId] ? cardText(byId[itemId]) : "");
  const groupShot = grp && grp.shot_id
    ? tour.shots.find(s => s.shot_id === grp.shot_id) : null;
  const ex = exampleUrl(groupShot || shotOfItem(itemId));
  const sheet = document.getElementById("sheet");
  const nocam = camMode !== "live";
  const center = nocam ? `<div class="novid">${esc(T().camHint)}</div>` : "";
  sheet.innerHTML = `${center}
    <div class="sheettop"><div class="sheetrow">
      <button class="iconbtn small" id="sheetClose" aria-label="${esc(T().close)}">${ICONS.x}</button>
      <div class="instruction">${esc(text)}</div>
      ${ex ? `<button class="exthumb" id="sheetEx" aria-label="${esc(T().howShould)}"><img src="${esc(ex)}" alt=""></button>` : ""}
    </div></div>
    <div class="sheetbar"><div class="pill" id="sheetWait" hidden>${esc(T().camStarting)}</div><div class="widepill"${camWide ? "" : " hidden"}>${esc(T().wide)}</div><button class="shutter" id="sheetSnap" aria-label="${esc(T().fixed)}"><span></span></button></div>`;
  sheet.className = nocam ? "nocam" : "";
  sheet.hidden = false;
  document.body.classList.add("sheet-open");
  document.getElementById("sheetClose").onclick = closeSheet;
  const sheetEx = document.getElementById("sheetEx");
  if (sheetEx) sheetEx.onclick = () => showBig(ex, T().howShould);
  document.getElementById("sheetSnap").onclick = () => sheetSnap(itemId);
  attachCamera();
}

function closeSheet() {
  camSheet = null;
  const sheet = document.getElementById("sheet");
  sheet.hidden = true;
  sheet.innerHTML = "";
  document.body.classList.remove("sheet-open");
  stopCamera();
  renderMaybe();
}

async function sheetSnap(itemId) {
  if (camMode === "live" && camLive()) {
    const video = document.getElementById("camView");
    if (!video.videoWidth) {
      const waitEl = document.getElementById("sheetWait");
      if (waitEl) waitEl.hidden = false;
      const ready = await waitForVideo(video, 1500);
      if (!camSheet) return;
      if (waitEl) waitEl.hidden = true;
      if (!ready || !camLive()) {
        closeSheet();
        pendingCard = itemId;
        pendingShot = null;
        document.getElementById("snapFile").click();
        return;
      }
    }
    const file = await captureFrame("camView");
    if (file) {
      flash();
      closeSheet();
      cardSnap(itemId, file);
      return;
    }
  }
  closeSheet();
  pendingCard = itemId;
  pendingShot = null;
  document.getElementById("snapFile").click();
}

function cardSnap(itemId, file) {
  const grp = groupOf(itemId);
  let itemIds = grp
    ? grp.item_ids.filter(id => cardOrder.indexOf(id) >= 0) : [itemId];
  if (!itemIds.length) itemIds = [itemId];
  const shot = (grp && grp.shot_id
    ? tour.shots.find(s => s.shot_id === grp.shot_id) : null)
    || shotForCard(itemId);
  if (!shot) return;
  let settled = false;
  const btn = document.getElementById("cardFixed");
  if (btn) btn.disabled = true;
  const remove = () => {
    for (const id of itemIds) {
      if (!settled) retakePhotos[id] = null;
      if (id in retakePhotos) {
        const i = cardOrder.indexOf(id);
        if (i >= 0) cardOrder.splice(i, 1);
      }
    }
    cardPanel = null;
    renderMaybe();
  };
  const card = document.querySelector("#app .stack .card");
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (card && !calm) {
    card.classList.add("out");
    setTimeout(remove, 220);
  } else {
    remove();
  }
  (async () => {
    const form = new FormData();
    form.append("shot_id", shot.shot_id);
    form.append("retake_items", itemIds.join(","));
    form.append("image", file);
    try {
      const res = await uploadWithRetry(`/api/runs/${encodeURIComponent(RUN)}/photos`, form);
      settled = true;
      for (const id of itemIds) retakePhotos[id] = res.photo_id;
      photoError = "";
      await refresh();
    } catch (e) {
      settled = true;
      for (const id of itemIds) delete retakePhotos[id];
      for (let i = itemIds.length - 1; i >= 0; i--) {
        if (cardOrder.indexOf(itemIds[i]) < 0) cardOrder.unshift(itemIds[i]);
      }
      photoError = e.name === "AbortError" ? T().notSent
        : e.message.indexOf("foto antigua") >= 0 ? T().oldPhoto : e.message;
    }
    renderMaybe();
  })();
}

async function resolveCard(itemId, action, reason) {
  stopSpeech();
  try {
    await api(`/api/runs/${encodeURIComponent(RUN)}/items/${encodeURIComponent(itemId)}/resolve`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action: action, reason: reason, note_id: cardNoteId}),
    });
    cardPanel = null;
    cardNoteId = null;
    cardNoteText = "";
    photoError = "";
    await refresh();
  } catch (e) {
    photoError = e.message;
  }
  renderMaybe();
}

function groupIdsFor(itemId) {
  const grp = shownGroup();
  if (grp && grp.item_ids.indexOf(itemId) >= 0) return grp.item_ids.slice();
  const g = groupOf(itemId);
  return g ? g.item_ids.slice() : [itemId];
}

async function resolveGroup(itemIds, action, reason) {
  stopSpeech();
  let failed = false;
  for (const id of itemIds) {
    try {
      await api(`/api/runs/${encodeURIComponent(RUN)}/items/${encodeURIComponent(id)}/resolve`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({action: action, reason: reason, note_id: cardNoteId}),
      });
    } catch (e) {
      // Show the message and keep the rest as cards.
      photoError = e.message;
      failed = true;
      break;
    }
  }
  if (!failed) {
    cardPanel = null;
    cardNoteId = null;
    cardNoteText = "";
    photoError = "";
  }
  try { await refresh(); } catch (e) {}
  renderMaybe();
}

async function finishRun() {
  try {
    await api(`/api/runs/${encodeURIComponent(RUN)}/finish`, {method: "POST"});
    photoError = "";
    await refresh();
    if (status.finished_at) navReplace("final");
  } catch (e) {
    photoError = e.message;
  }
  renderMaybe();
}

async function endRound() {
  try {
    await api(`/api/runs/${encodeURIComponent(RUN)}/end-round`, {method: "POST"});
    photoError = "";
    roundView = "card";
    await refresh();
  } catch (e) {
    photoError = e.message;
  }
  renderMaybe();
}

async function skipShot(shotId) {
  stopSpeech();
  const shot = tour.shots.find(x => x.shot_id === shotId);
  try {
    await api(`/api/runs/${encodeURIComponent(RUN)}/skip-room`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({room_id: shot ? shot.room_id : ""}),
    });
    photoError = "";
    await refresh();
  } catch (e) {
    photoError = e.message;
  }
  lastKey = null;
  renderMaybe();
}

async function retryUnchecked() {
  retrying = true;
  renderMaybe();
  try {
    await api(`/api/runs/${encodeURIComponent(RUN)}/recheck-unchecked`, {method: "POST"});
    photoError = "";
    await refresh();
  } catch (e) {
    photoError = e.message;
  }
  retrying = false;
  renderMaybe();
}

function showToast(text) {
  toast = text;
  chime();
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastTimer = null;
    toast = null;
    renderMaybe();
  }, 3500);
  renderMaybe();
}

function reconcileCards() {
  const server = [];
  for (const g of cardGroups()) {
    for (const id of (g.item_ids || [])) {
      if (server.indexOf(id) < 0) server.push(id);
    }
  }
  const serverCards = status.cards || [];
  for (const id of serverCards) {
    if (server.indexOf(id) < 0) server.push(id);
  }
  // One toast per retake photo, only when none of its items is back.
  const byPid = {};
  for (const id of Object.keys(retakePhotos)) {
    const pid = retakePhotos[id];
    if (pid) (byPid[pid] = byPid[pid] || []).push(id);
  }
  for (const pid of Object.keys(byPid)) {
    if ((status.checking || []).indexOf(pid) >= 0) continue;
    const ids = byPid[pid];
    for (const id of ids) delete retakePhotos[id];
    const back = ids.filter(id => server.indexOf(id) >= 0);
    if (!back.length) {
      showToast(T().fixedToast);
    } else {
      for (const id of back) {
        if (cardOrder.indexOf(id) < 0) cardOrder.push(id);
      }
    }
  }
  for (let i = cardOrder.length - 1; i >= 0; i--) {
    if (server.indexOf(cardOrder[i]) < 0) cardOrder.splice(i, 1);
  }
  for (const id of server) {
    if (cardOrder.indexOf(id) < 0) cardOrder.push(id);
  }
}

function announce() {
  if (!status || !tour) return;
  if (screenOf() === "reminder") {
    const key = skippedKey();
    if (key && skipReminderSpokenKey !== key) {
      skipReminderSpokenKey = key;
      sayNow(T().skippedTitle + ". " + T().skippedTakeLine);
    }
    return;
  }
  if (!allTaken() && !status.round_ended) {
    const cur = roundCurrent();
    const curId = cur ? cur.shot_id : null;
    if (prevShotId !== null && curId && curId !== prevShotId) {
      sayNow(roomHeading(cur) + ". " + instruction(cur));
    }
    if (curId) prevShotId = curId;
    return;
  }
  let justPhotosDone = false;
  if (!photosDoneSaid) {
    photosDoneSaid = true;
    justPhotosDone = true;
    sayNow(T().photosDone);
  }
  const byId = itemsById();
  const group = shownGroup();
  const shown = group ? group.item_ids[0] : null;
  if (shown && byId[shown]) {
    const gkey = group.item_ids.join(",");
    if (gkey !== spokenCard) {
      spokenCard = gkey;
      const lines = group.item_ids
        .map(id => byId[id] ? cardText(byId[id]) : "").filter(Boolean)
        .join(". ");
      if (justPhotosDone) say(lines);
      else sayNow(lines);
    }
  }
  if (status.finished_at && !saidFinal) {
    saidFinal = true;
    sayNow(T().doneAll);
  }
}

async function refresh() {
  if (!tour || tourRun !== RUN) {
    const t = await api(`/api/runs/${encodeURIComponent(RUN)}/tour`);
    tour = {shots: t.shots};
    tourRun = RUN;
  }
  const s = await api(`/api/runs/${encodeURIComponent(RUN)}/status`);
  status = s;
  takenSet = new Set((s.recent || []).map(e => e.shot_id));
  reconcileCards();
  if (voiceTourRun !== RUN) {
    voiceTourRun = RUN;
    warmShotLines();
  }
  warmCardLines();
  if (s.language && I18N[s.language]) {
    if (LANG !== s.language) { LANG = s.language; pickVoice(); }
    langPicked = true;
  }
  if (DEMO && demoPhotos === null) {
    try { demoPhotos = (await api("/api/demo-photos")).photos; }
    catch (e) { demoPhotos = []; }
  }
  announce();
}

function startPoll() {
  if (pollTimer) return;
  const tick = async () => {
    pollTimer = null;
    try {
      await refresh();
      renderMaybe();
    } catch (e) {
      // A hung GET aborts after GET_TIMEOUT_MS; scheduling in finally
      // means the loop always recovers by itself.
    } finally {
      if (RUN) {
        let busy = false;
        for (const entry of optimistic.values()) {
          if (entry.state !== "failed") { busy = true; break; }
        }
        if (!busy && status && status.checking && status.checking.length) busy = true;
        pollTimer = setTimeout(tick, busy ? 500 : 2000);
      }
    }
  };
  pollTimer = setTimeout(tick, 2000);
}

async function boot() {
  document.getElementById("snapFile").onchange = ev => {
    const input = ev.target;
    const file = input.files.length ? input.files[0] : null;
    input.value = "";
    if (!file || !tour) {
      pendingShot = null;
      pendingCard = null;
      return;
    }
    if (pendingCard) {
      const id = pendingCard;
      pendingCard = null;
      cardSnap(id, file);
    } else if (pendingShot) {
      const shot = tour.shots.find(x => x.shot_id === pendingShot);
      pendingShot = null;
      if (shot) snapShot(shot, file);
    }
  };
  document.getElementById("overlay").onclick = () => {
    document.getElementById("overlay").style.display = "none";
  };
  document.addEventListener("click", () => {
    if (voiceUnlocked) return;
    voiceUnlocked = true;
    try {
      const el = audioEl();
      el.src = silentClipUrl();
      playQuiet(el);
    } catch (e) {}
  }, true);
  document.addEventListener("visibilitychange", async () => {
    if (document.hidden) {
      stopCamera();
      return;
    }
    if (RUN) {
      if (!status || !status.finished_at) lockScreen();
      try { await refresh(); renderMaybe(); } catch (e) {}
      if (camSheet || screenOf() === "round") attachCamera();
    }
  });
  window.addEventListener("popstate", ev => {
    navDepth = Math.max(0, navDepth - 1);
    applyNavState(ev.state && ev.state.pot);
  });
  const saved = loadSavedLang();
  if (saved && I18N[saved]) {
    LANG = saved;
    langPicked = true;
    pickVoice();
  }
  const app = document.getElementById("app");
  try {
    if (RUN) {
      resetRunState();
      await refresh();
      startPoll();
      if (status.finished_at) navReplace("final");
      else {
        navReplace("run");
        lockScreen();
      }
    } else if (!langPicked) {
      navReplace("language");
    } else {
      navReplace("choice");
    }
    renderMaybe();
  } catch (e) { fail(app, e); }
}
boot();
