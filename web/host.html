<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnover review</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0;
         padding: 16px 24px; max-width: 1100px; margin-left: auto; margin-right: auto;
         background: #fff; color: #1f2328; }
  h1 { font-size: 24px; }
  h2 { font-size: 19px; margin: 28px 0 8px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  .banner { border-radius: 10px; padding: 14px 18px; font-size: 20px; margin: 12px 0; }
  .banner.needs_input { background: #fff8c5; }
  .banner.awaiting_signoff { background: #ddf4ff; }
  .banner.done { background: #dafbe1; }
  table.items { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.items td, table.items th { border-bottom: 1px solid #eee; padding: 8px 10px;
         text-align: left; vertical-align: top; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 13px;
          color: #fff; white-space: nowrap; }
  .pill.proven { background: #1a7f37; }
  .pill.problem { background: #b42318; }
  .pill.needs-photo { background: #b54708; }
  .pill.not-yet { background: #57606a; }
  .thumb { width: 120px; cursor: zoom-in; border-radius: 6px; }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
             cursor: zoom-out; z-index: 10; text-align: center; padding: 24px; }
  #overlay img { max-width: 95%; max-height: 95%; }
  table.calls { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.calls td, table.calls th { border-bottom: 1px solid #eee; padding: 5px 8px; text-align: left; }
  table.calls td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .row > div { flex: 1 1 300px; }
  button { font-size: 16px; padding: 10px 18px; margin: 6px 8px 6px 0; cursor: pointer; }
  #approve { background: #1a7f37; color: #fff; border: none; border-radius: 8px; }
  #sendback { background: #fff; border: 1px solid #999; border-radius: 8px; }
  input[type=text] { font-size: 15px; padding: 8px; width: 100%; }
  .sendback-list { max-height: 220px; overflow-y: auto; border: 1px solid #ddd;
                   border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .sendback-list label { display: block; padding: 3px 0; font-size: 15px; }
  .error { background: #ffebe9; border-radius: 10px; padding: 14px; margin: 12px 0; }
  .small { font-size: 13px; color: #57606a; }
  ul.runs li { margin: 8px 0; font-size: 17px; }
</style>
</head>
<body>
<div id="app"><p>Loading…</p></div>
<div id="overlay"><img id="big" alt="evidence"></div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const CODE = params.get("code") || "";
const RUN = params.get("run") || "";

async function api(path, opts) {
  const r = await fetch(path, opts || {});
  if (r.status === 401) throw new Error("auth");
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return r.json();
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

const STATE_TEXT = {
  needs_input: "Waiting for photos",
  awaiting_signoff: "Every critical item proven — ready to review",
  done: "Approved",
};

function evidenceUrl(itemId) {
  return `/api/runs/${encodeURIComponent(RUN)}/evidence/${encodeURIComponent(itemId)}`;
}

function renderRuns(app, runs) {
  app.innerHTML = `<h1>Turnovers</h1><ul class="runs">` + runs.map(r =>
    `<li><a href="/host?run=${esc(r.run_id)}&code=${esc(CODE)}">${esc(r.run_id)}</a>
     <span class="small">${esc(r.property)} · ${esc(r.agent_state)}</span></li>`
  ).join("") + `</ul>`;
}

function renderStatus(app, status, calls) {
  const rooms = status.rooms.map(room => {
    const rows = room.items.map(item => {
      const ev = item.has_evidence
        ? `<img class="thumb" src="${evidenceUrl(item.id)}" data-full="${evidenceUrl(item.id)}" alt="evidence" loading="lazy">`
        : "";
      const req = item.request ? `<div class="small">Request: ${esc(item.request.host)}</div>` : "";
      const crit = item.critical ? "" : ` <span class="small">(optional)</span>`;
      return `<tr><td>${esc(item.label)}${crit}<div class="small">${esc(item.reason || "")}</div>${req}</td>
        <td><span class="pill ${esc(item.status.replace(" ", "-"))}">${esc(item.status)}</span></td><td>${ev}</td></tr>`;
    }).join("");
    return `<h2>${esc(room.name)}</h2><table class="items">${rows}</table>`;
  }).join("");

  const callRows = calls.slice(-60).reverse().map(c =>
    `<tr><td class="small">${esc(c.time || "")}</td><td>${esc(c.model || "")}</td>
     <td>${esc(c.purpose || "")}</td><td>${esc(c.photo_id || "")}</td>
     <td class="num">${esc(c.seconds)}</td><td>${esc(c.source || "")}</td></tr>`
  ).join("");

  const open = status.open.map(id => {
    let label = id;
    for (const room of status.rooms) for (const item of room.items) {
      if (item.id === id) label = `${room.name} — ${item.label}`;
    }
    return `<label><input type="checkbox" value="${esc(id)}"> ${esc(label)}</label>`;
  }).join("");

  app.innerHTML = `
    <h1>Turnover ${esc(status.run_id)}</h1>
    <div class="banner ${esc(status.agent_state)}">${esc(STATE_TEXT[status.agent_state] || status.agent_state)}</div>
    <div class="row">
      <div>
        <h2>Sign off</h2>
        <button id="approve">Approve turnover</button>
        <h2>Send back</h2>
        <div class="sendback-list">${open || "<span class='small'>Nothing open.</span>"}</div>
        <input type="text" id="notes" placeholder="Notes for the cleaner">
        <button id="sendback">Send back with notes</button>
        <div id="signMsg"></div>
      </div>
      <div>
        <h2>Cleaner link</h2>
        <img id="qr" alt="QR code for the cleaner page">
        <div class="small" id="cleanUrl"></div>
      </div>
    </div>
    ${rooms}
    <h2>Model log (${calls.length} calls)</h2>
    <table class="calls"><tr><th>Time</th><th>Model</th><th>Checked</th><th>Photo</th><th>Sec</th><th>Live/recorded</th></tr>${callRows}</table>`;

  document.getElementById("approve").onclick = async () => {
    const r = await api(`/api/runs/${encodeURIComponent(RUN)}/signoff`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({decision: "approve"}),
    });
    document.getElementById("signMsg").textContent = "Approved.";
    boot();
  };
  document.getElementById("sendback").onclick = async () => {
    const items = Array.from(document.querySelectorAll(".sendback-list input:checked"))
      .map(el => el.value);
    const notes = document.getElementById("notes").value;
    try {
      await api(`/api/runs/${encodeURIComponent(RUN)}/signoff`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({decision: "sendback", notes: notes, item_ids: items}),
      });
      document.getElementById("signMsg").textContent = "Sent back.";
      boot();
    } catch (e) {
      document.getElementById("signMsg").textContent = e.message;
    }
  };
  app.querySelectorAll(".thumb").forEach(img => {
    img.onclick = () => {
      document.getElementById("big").src = img.getAttribute("data-full");
      document.getElementById("overlay").style.display = "block";
    };
  });
  document.getElementById("overlay").onclick = () => {
    document.getElementById("overlay").style.display = "none";
  };
  setQr();
}

async function setQr() {
  let host = location.hostname;
  if (!host || host === "localhost" || host === "127.0.0.1") {
    try { host = (await api("/api/server-ip")).ip; } catch (e) {}
  }
  const url = `${location.protocol}//${host}:${location.port}/clean?run=${encodeURIComponent(RUN)}&code=${encodeURIComponent(CODE)}`;
  document.getElementById("qr").src = `/api/qr?text=${encodeURIComponent(url)}`;
  document.getElementById("cleanUrl").textContent = url;
}

function fail(app, e) {
  app.innerHTML = e.message === "auth"
    ? `<div class="error">This link has no access code.</div>`
    : `<div class="error">${esc(e.message)}</div>`;
}

async function boot() {
  const app = document.getElementById("app");
  try {
    if (!RUN) {
      renderRuns(app, (await api("/api/runs")).runs);
      return;
    }
    const [status, callData] = await Promise.all([
      api(`/api/runs/${encodeURIComponent(RUN)}/status`),
      api(`/api/runs/${encodeURIComponent(RUN)}/calls`),
    ]);
    renderStatus(app, status, callData.calls);
    setInterval(async () => {
      try {
        const [s, c] = await Promise.all([
          api(`/api/runs/${encodeURIComponent(RUN)}/status`),
          api(`/api/runs/${encodeURIComponent(RUN)}/calls`),
        ]);
        const notes = document.getElementById("notes");
        const dirty = notes && (notes.value ||
          document.querySelector(".sendback-list input:checked"));
        if (!dirty) renderStatus(app, s, c.calls);
      } catch (e) {}
    }, 2000);
  } catch (e) { fail(app, e); }
}
boot();
</script>
</body>
</html>
