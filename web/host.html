<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F5">
<title>Turnover review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --linen: #F3F6F5; --ink: #1B2A2C; --haint: #A8D5CF; --marsh: #1F5E59;
    --marsh-dark: #174844; --brick: #B5432F; --dune: #C9962E; --dune-bg: #FBF3DF;
    --white: #FFFFFF; --muted: #5C7375; --line: #D8E2E0;
    --float-shadow: 0 8px 28px rgba(27, 42, 44, 0.18);
  }
  * { box-sizing: border-box; }
  body { font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
         margin: 0; padding: 16px 24px 32px; max-width: 1100px;
         margin-left: auto; margin-right: auto;
         background: var(--linen); color: var(--ink); font-size: 17px; line-height: 24px; }
  h1 { font-size: 22px; line-height: 28px; }
  h2 { font-size: 19px; margin: 28px 0 8px; border-bottom: 1px solid var(--line);
       padding-bottom: 4px; }
  :focus-visible { outline: 3px solid var(--marsh); outline-offset: 2px; }
  .banner { border-radius: 20px; padding: 14px 18px; font-size: 20px; margin: 12px 0; }
  .banner.needs_input { background: var(--dune-bg); }
  .banner.awaiting_signoff { background: var(--haint); }
  .banner.done { background: var(--marsh); color: var(--white); }
  .banner.api-down { background: var(--brick); color: var(--white); }
  .news { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 12px; }
  .news .card { flex: 0 0 200px; background: var(--white); border-radius: 20px;
                padding: 10px 12px; font-size: 13px; }
  .news .card img { width: 100%; border-radius: 12px; margin-top: 6px; }
  .news .time { color: var(--muted); font-size: 12px; }
  table.items { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.items td, table.items th { border-bottom: 1px solid var(--line); padding: 8px 10px;
         text-align: left; vertical-align: top; }
  .pill { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px;
          font-weight: 700; white-space: nowrap; color: var(--ink); }
  .pill.proven { background: var(--haint); }
  .pill.problem { background: var(--brick); color: var(--white); }
  .pill.needs-photo { background: var(--dune-bg); border: 2px solid var(--dune); }
  .pill.not-yet { background: var(--line); }
  .pill.damage { background: var(--brick); color: var(--white); }
  .pill.missing { background: var(--dune-bg); border: 2px solid var(--dune); }
  .pill.supplies { background: var(--marsh); color: var(--white); }
  .pill.other { background: var(--line); }
  .news .card audio { width: 100%; margin-top: 6px; }
  .duo { display: flex; gap: 8px; }
  .duo figure { margin: 6px 0 0; flex: 1 1 0; }
  .duo img { width: 100%; border-radius: 12px; }
  .thumb { width: 120px; cursor: zoom-in; border-radius: 12px; }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(12, 20, 21, 0.9);
             cursor: zoom-out; z-index: 10; text-align: center; padding: 24px; }
  #overlay img { max-width: 95%; max-height: 95%; border-radius: 20px; }
  table.calls { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.calls td, table.calls th { border-bottom: 1px solid var(--line); padding: 5px 8px;
         text-align: left; }
  table.calls td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .row > div { flex: 1 1 300px; }
  button { font-size: 16px; font-family: inherit; font-weight: 700; padding: 12px 20px;
           margin: 6px 8px 6px 0; cursor: pointer; min-height: 48px; }
  #approve { background: var(--marsh); color: var(--white); border: none; border-radius: 20px; }
  #sendback { background: var(--white); color: var(--ink); border: 2px solid var(--line);
              border-radius: 20px; }
  input[type=text] { font-size: 15px; font-family: inherit; padding: 10px 12px; width: 100%;
         border-radius: 20px; border: 2px solid var(--line); background: var(--white);
         color: var(--ink); }
  .sendback-list { max-height: 220px; overflow-y: auto; background: var(--white);
                   border: 2px solid var(--line); border-radius: 20px; padding: 8px 12px;
                   margin: 8px 0; }
  .sendback-list label { display: block; padding: 3px 0; font-size: 15px; }
  .error { background: #F7D9D2; border-radius: 20px; padding: 14px 16px; margin: 12px 0; }
  .small { font-size: 14px; color: var(--muted); }
  ul.runs li { margin: 8px 0; font-size: 15px; }
</style>
</head>
<body>
<div id="app"><p>Loading…</p></div>
<div id="overlay"><img id="big" alt="evidence"></div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const CODE = params.get("code") || "";
const DEMO = params.get("demo") === "1";
const TEST = params.get("test") === "1";
const FOLLOW = !params.get("run");
let RUN = params.get("run") || "";
let status = null, calls = [], runsList = [], lastKey = null, cleanerUrl = "";
let langNames = {};

async function api(path, opts) {
  const r = await fetch(path, opts || {});
  if (r.status === 401) throw new Error("auth");
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return r.json();
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

const STATE_TEXT = {
  needs_input: "Waiting for photos",
  awaiting_signoff: "Ready to review — every critical item proven or reported",
  done: "Approved",
};

const REASON_TEXT = {
  broken: "Broken or damaged",
  before: "Was like this before",
  supplies: "Out of supplies",
  wont_clean: "Won't come clean",
  other: "Other",
};

function overviewUrl(photoId) {
  return `/api/runs/${encodeURIComponent(RUN)}/photos/${encodeURIComponent(photoId)}/overview`;
}

function evidenceUrl(item) {
  if (item.has_evidence) {
    return `/api/runs/${encodeURIComponent(RUN)}/evidence/${encodeURIComponent(item.id)}?v=${encodeURIComponent(item.photo_id)}`;
  }
  if (item.photo_id) return overviewUrl(item.photo_id);
  return "";
}

function beforeUrl(item) {
  return `/api/runs/${encodeURIComponent(RUN)}/evidence/${encodeURIComponent(item.id + ".before")}?v=${encodeURIComponent(item.photo_id)}`;
}

function noteById(noteId) {
  return (status.voice_notes || []).find(n => n.id === noteId) || null;
}

function allItems() {
  const out = [];
  for (const room of status.rooms) {
    for (const item of room.items) out.push({room: room, item: item});
  }
  return out;
}

function needsDecisionHtml() {
  const rows = allItems().filter(({item}) => item.resolution);
  if (!rows.length) return "";
  const cards = rows.map(({room, item}) => {
    const res = item.resolution;
    const kind = res.action === "cant_fix" ? "reported" : "disputed";
    const decision = res.action === "cant_fix"
      ? `Can't fix: ${res.reason ? (REASON_TEXT[res.reason] || res.reason) : "no reason given"}`
      : "Cleaner says it's fine";
    const url = evidenceUrl(item);
    const img = url ? `<img src="${url}" data-full="${url}" class="thumb" alt="evidence" loading="lazy">` : "";
    const note = res.note_id ? noteById(res.note_id) : null;
    const noteHtml = note
      ? `<div>${esc(note.english)}</div>
         <div class="small">Original (${esc(note.language)}): ${esc(note.text)}</div>
         ${note.audio_url ? `<div><audio controls preload="none" src="${esc(note.audio_url)}"></audio></div>` : ""}`
      : "";
    return `<div class="card"><div><span class="pill ${kind === "reported" ? "missing" : "other"}">${kind}</span>
      <span class="small">${esc(room.name)}</span></div>
      <div><strong>${esc(item.label)}</strong></div>
      <div class="small">${esc(decision)}</div>${img}${noteHtml}</div>`;
  }).join("");
  return `<h2>Needs your decision</h2><div class="news">${cards}</div>`;
}

function fixedByCleanerHtml() {
  const rows = allItems().filter(({item}) => item.has_before);
  if (!rows.length) return "";
  const cards = rows.map(({room, item}) => {
    const before = `<img src="${beforeUrl(item)}" data-full="${beforeUrl(item)}" alt="before" loading="lazy">`;
    const url = evidenceUrl(item);
    const after = url ? `<img src="${url}" data-full="${url}" alt="after" loading="lazy">` : "";
    return `<div class="card"><div class="small">${esc(room.name)}</div>
      <div><strong>${esc(item.label)}</strong></div>
      <div class="duo"><figure><figcaption class="small">Before</figcaption>${before}</figure>
      <figure><figcaption class="small">After</figcaption>${after}</figure></div></div>`;
  }).join("");
  return `<h2>Fixed by cleaner</h2><div class="news">${cards}</div>`;
}

function newsHtml() {
  const news = status.news || [];
  if (!news.length) return "";
  const cards = news.map(ev => {
    const img = ev.photo_id ? `<img src="${overviewUrl(ev.photo_id)}" alt="" loading="lazy">` : "";
    const what = ev.kind === "note" ? `${esc(ev.room_name)} — note: ${esc(ev.text)}`
      : ev.kind === "resolution" ? resolutionNews(ev)
      : ev.kind === "request" || !ev.item_label ? esc(ev.text)
      : `${esc(ev.room_name)} — ${esc(ev.item_label)}: ${esc(ev.status)}`;
    return `<div class="card"><div class="time">${esc(ev.time || "")}</div>
      <div>${what}</div>${img}</div>`;
  }).join("");
  return `<h2>Latest news</h2><div class="news">${cards}</div>`;
}

function resolutionNews(ev) {
  const head = ev.item_label ? `${esc(ev.room_name)} — ${esc(ev.item_label)}: ` : "";
  if (ev.status === "cant_fix") {
    const reason = ev.reason ? (REASON_TEXT[ev.reason] || ev.reason) : "no reason given";
    const lower = reason.charAt(0).toLowerCase() + reason.slice(1);
    return `${head}can't fix (${lower})`;
  }
  return `${head}cleaner says it's fine`;
}

function voiceNotesHtml() {
  const notes = status.voice_notes || [];
  if (!notes.length) return "";
  const cards = notes.map(n => {
    const audio = n.audio_url
      ? `<div><audio controls preload="none" src="${esc(n.audio_url)}"></audio></div>` : "";
    const hhmmss = (n.time || "").slice(11, 19);
    return `<div class="card"><div><span class="pill ${esc(n.category)}">${esc(n.category)}</span>
      <span class="small">${esc(n.room_name)} · ${esc(hhmmss)}</span></div>
      <div><strong>${esc(n.title)}</strong></div>
      <div>${esc(n.english)}</div>
      <div class="small">Original (${esc(n.language)}): ${esc(n.text)}</div>${audio}</div>`;
  }).join("");
  return `<h2>Voice notes</h2><div class="news">${cards}</div>`;
}

function noteWarnings() {
  const flags = (status.voice_notes || []).filter(
    n => n.category === "damage" || n.category === "missing");
  if (!flags.length) return "";
  return `<div>` + flags.map(n =>
    `<div class="small"><span class="pill ${esc(n.category)}">${esc(n.category)}</span>
     ${esc(n.room_name)} — ${esc(n.title)}</div>`
  ).join("") + `</div>`;
}

function renderStatus(app) {
  const rooms = status.rooms.map(room => {
    const rows = room.items.map(item => {
      const url = evidenceUrl(item);
      const ev = url
        ? `<img class="thumb" src="${url}" data-full="${url}" alt="evidence" loading="lazy">`
        : "";
      const req = item.request ? `<div class="small">Request: ${esc(item.request.host)}</div>` : "";
      const crit = item.critical ? "" : ` <span class="small">(optional)</span>`;
      return `<tr><td>${esc(item.label)}${crit}<div class="small">${esc(item.reason || "")}</div>${req}</td>
        <td><span class="pill ${esc(item.status.replace(" ", "-"))}">${esc(item.status)}</span></td><td>${ev}</td></tr>`;
    }).join("");
    return `<h2>${esc(room.name)}</h2><table class="items">${rows}</table>`;
  }).join("");

  const callRows = calls.slice(-60).reverse().map(c =>
    `<tr><td class="small">${esc(c.time || "")}</td><td>${esc(c.model || "")}</td>
     <td>${esc(c.purpose || "")}</td><td>${esc(c.photo_id || "")}</td>
     <td class="num">${esc(c.seconds)}</td><td>${esc(c.source || "")}</td></tr>`
  ).join("");

  const open = status.open.map(id => {
    let label = id;
    for (const room of status.rooms) for (const item of room.items) {
      if (item.id === id) label = `${room.name} — ${item.label}`;
    }
    return `<label><input type="checkbox" value="${esc(id)}"> ${esc(label)}</label>`;
  }).join("");

  const older = runsList.filter(r => r.run_id !== RUN).map(r =>
    `<li><a href="/host?run=${esc(r.run_id)}&code=${esc(CODE)}">${esc(r.run_id)}</a>
     <span class="small">${esc(r.property)} · ${esc(r.agent_state)}</span></li>`
  ).join("");

  app.innerHTML = `
    <h1>Turnover ${esc(status.run_id)}</h1>
    <div class="banner ${esc(status.agent_state)}">${esc(STATE_TEXT[status.agent_state] || status.agent_state)}</div>
    ${status.api_status && !status.api_status.ok ? `<div class="banner api-down">AI checks are failing: ${esc(status.api_status.message)}</div>` : ""}
    ${status.language ? `<div class="small">Cleaner language: ${esc(langNames[status.language] || status.language)}</div>` : ""}
    ${status.finished_at ? `<div class="small">Cleaner finished at ${esc(status.finished_at.slice(11, 19))}</div>` : ""}
    ${status.round_ended ? `<div class="small">Ended early: ${status.skipped_shots.length} shots skipped (test)</div>` : ""}
    ${needsDecisionHtml()}
    ${fixedByCleanerHtml()}
    ${newsHtml()}
    ${voiceNotesHtml()}
    <div class="row">
      <div>
        <h2>Sign off</h2>
        <button id="approve">Approve turnover</button>
        ${noteWarnings()}
        <h2>Send back</h2>
        <div class="sendback-list">${open || "<span class='small'>Nothing open.</span>"}</div>
        <input type="text" id="notes" placeholder="Notes for the cleaner">
        <button id="sendback">Send back with notes</button>
        <div id="signMsg"></div>
      </div>
      <div>
        <h2>Cleaner link</h2>
        <img id="qr" alt="QR code for the cleaner page"${cleanerUrl ? ` src="/api/qr?text=${encodeURIComponent(cleanerUrl)}"` : ""}>
        <div class="small" id="cleanUrl">${esc(cleanerUrl)}</div>
        <h2>Older turnovers</h2>
        <ul class="runs">${older || "<li class='small'>None.</li>"}</ul>
      </div>
    </div>
    ${rooms}
    <h2>Model log (${calls.length} calls)</h2>
    <table class="calls"><tr><th>Time</th><th>Model</th><th>Checked</th><th>Photo</th><th>Sec</th><th>Live/recorded</th></tr>${callRows}</table>`;

  document.getElementById("approve").onclick = async () => {
    await api(`/api/runs/${encodeURIComponent(RUN)}/signoff`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({decision: "approve"}),
    });
    document.getElementById("signMsg").textContent = "Approved.";
    await refresh();
    renderMaybe(true);
  };
  document.getElementById("sendback").onclick = async () => {
    const items = Array.from(document.querySelectorAll(".sendback-list input:checked"))
      .map(el => el.value);
    const notes = document.getElementById("notes").value;
    try {
      await api(`/api/runs/${encodeURIComponent(RUN)}/signoff`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({decision: "sendback", notes: notes, item_ids: items}),
      });
      document.getElementById("signMsg").textContent = "Sent back.";
      await refresh();
      renderMaybe(true);
    } catch (e) {
      document.getElementById("signMsg").textContent = e.message;
    }
  };
  app.querySelectorAll("[data-full]").forEach(img => {
    img.onclick = () => {
      document.getElementById("big").src = img.getAttribute("data-full");
      document.getElementById("overlay").style.display = "block";
    };
  });
  paintQr();
}

function paintQr() {
  if (!cleanerUrl) return;
  const img = document.getElementById("qr");
  const txt = document.getElementById("cleanUrl");
  if (img) img.src = `/api/qr?text=${encodeURIComponent(cleanerUrl)}`;
  if (txt) txt.textContent = cleanerUrl;
}

async function resolveCleanerUrl() {
  let hostPart = location.host;
  if (!location.hostname || location.hostname === "localhost" ||
      location.hostname === "127.0.0.1") {
    try {
      const ip = (await api("/api/server-ip")).ip;
      hostPart = ip + (location.port ? ":" + location.port : "");
    } catch (e) {}
  }
  cleanerUrl = `${location.protocol}//${hostPart}/clean?code=${encodeURIComponent(CODE)}`
    + (DEMO ? "&demo=1" : "") + (TEST ? "&test=1" : "");
  paintQr();
}

function renderMaybe(force) {
  if (!force) {
    const notes = document.getElementById("notes");
    const dirty = notes && (notes.value ||
      document.querySelector(".sendback-list input:checked"));
    if (dirty) return;
  }
  const key = JSON.stringify([RUN, status, calls]);
  if (!force && key === lastKey) return;
  lastKey = key;
  renderStatus(document.getElementById("app"));
}

function fail(app, e) {
  app.innerHTML = e.message === "auth"
    ? `<div class="error">This link has no access code.</div>`
    : `<div class="error">${esc(e.message)}</div>`;
}

function useRun(runId) {
  RUN = runId;
  const url = new URL(location.href);
  url.searchParams.set("run", RUN);
  history.replaceState(null, "", url);
}

async function fetchRunsList() {
  try { runsList = (await api("/api/runs")).runs; }
  catch (e) { runsList = []; }
}

async function refresh() {
  if (FOLLOW) {
    const latest = (await api("/api/runs/latest")).run_id;
    if (!latest) return false;
    if (latest !== RUN) {
      useRun(latest);
      await fetchRunsList();
    }
  }
  const [s, c] = await Promise.all([
    api(`/api/runs/${encodeURIComponent(RUN)}/status`),
    api(`/api/runs/${encodeURIComponent(RUN)}/calls`),
  ]);
  status = s;
  calls = c.calls;
  return true;
}

async function boot() {
  document.getElementById("overlay").onclick = () => {
    document.getElementById("overlay").style.display = "none";
  };
  const app = document.getElementById("app");
  try {
    resolveCleanerUrl();
    try {
      for (const l of (await api("/api/languages")).languages) langNames[l.code] = l.name;
    } catch (e) {}
    await fetchRunsList();
    if (!(await refresh())) {
      app.innerHTML = "<h1>Turnovers</h1><p>No turnovers yet — start one from the cleaner page.</p>";
    } else {
      renderMaybe();
    }
    setInterval(async () => {
      try {
        if (await refresh()) renderMaybe();
        else {
          app.innerHTML = "<h1>Turnovers</h1><p>No turnovers yet — start one from the cleaner page.</p>";
          lastKey = null;
        }
      } catch (e) {}
    }, 2000);
  } catch (e) { fail(app, e); }
}
boot();
</script>
</body>
</html>
